<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

    html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
    *{box-sizing:border-box;}
    button{font-family:inherit;}
    @keyframes qm-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes qm-blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes qm-cheer{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-16px) rotate(-6deg)}50%{transform:translateY(-3px) rotate(5deg)}75%{transform:translateY(-13px) rotate(-3deg)}}
    @keyframes qm-sadwob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(4px) rotate(2deg)}}
    @keyframes qm-pop{0%{transform:scale(.7);opacity:0}62%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
    @keyframes qm-fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(102vh) rotate(760deg);opacity:.85}}
    @keyframes qm-slidein{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
    @keyframes qm-slideup{0%{transform:translateY(100%);opacity:.3}100%{transform:translateY(0);opacity:1}}
    @keyframes qm-pulse{0%,100%{box-shadow:0 0 0 0 rgba(120,200,60,.45)}70%{box-shadow:0 0 0 16px rgba(120,200,60,0)}}
    @keyframes qm-spin{to{transform:rotate(360deg)}}
    @keyframes qm-floatup{0%{transform:translateY(6px);opacity:0}18%{opacity:1}100%{transform:translateY(-46px);opacity:0}}
    @keyframes qm-ring{from{stroke-dashoffset:var(--qm-ringlen)}}
    @keyframes qm-armwave{0%,100%{transform:rotate(-17deg)}50%{transform:rotate(13deg)}}
    @keyframes qm-armpump{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-4deg)}}
    @keyframes qm-raiseL{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}
    @keyframes qm-raiseR{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
    @keyframes qm-clapL{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(10px) rotate(9deg)}}
    @keyframes qm-clapR{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-10px) rotate(-9deg)}}
    @keyframes qm-armpoint{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
    @keyframes qm-shrug{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes qm-headtilt{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
    @keyframes qm-fadein{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes qm-shine{0%{background-position:200% 0}100%{background-position:-200% 0}}
    @keyframes qm-floatpip{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    ::-webkit-scrollbar{width:12px;height:12px}
    ::-webkit-scrollbar-thumb{background:var(--qm-lineStrong);border-radius:999px;border:3px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-track{background:transparent}
  
</style>
</head>
<body>
<div id="root"></div>
<script>
// Supabase config — fill in your values or leave blank for local mode
window.QM_CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: ''
};
</script>
<script>
// DCLogic — Claude Design base class adapted for standalone React
class DCLogic extends React.Component {
  constructor(props) {
    super(props);
    if (this.state === undefined) this.state = {};
  }
  render() {
    const vals = this.renderVals();
    return vals.app;
  }
}
</script>
<script>

const h = React.createElement;
const T = {
  bg:'var(--qm-bg)', surface:'var(--qm-surface)', surface2:'var(--qm-surface2)',
  ink:'var(--qm-ink)', inkStrong:'var(--qm-inkStrong)', muted:'var(--qm-muted)',
  line:'var(--qm-line)', lineStrong:'var(--qm-lineStrong)',
  primary:'var(--qm-primary)', press:'var(--qm-primaryPress)',
  accent:'var(--qm-accent)', accentPress:'var(--qm-accentPress)',
  gold:'var(--qm-gold)', flame:'var(--qm-flame)',
  red:'var(--qm-red)', redPress:'var(--qm-redPress)',
  correctBg:'var(--qm-correctBg)', correctInk:'var(--qm-correctInk)',
  wrongBg:'var(--qm-wrongBg)', wrongInk:'var(--qm-wrongInk)',
  code:'var(--qm-code)', codeInk:'var(--qm-codeInk)', shadow:'var(--qm-shadow)',
  mascot:'var(--qm-mascot)', mascotBelly:'var(--qm-mascotBelly)', leaf:'var(--qm-leaf)',
};
const SKINS = {
  grass:{primary:'#58cc02',press:'#4aa802',accent:'#1cb0f6',accentPress:'#1691cf',mascot:'#7ed957',belly:'#c4f09e',leaf:'#58cc02'},
  sky:  {primary:'#1cb0f6',press:'#1391d3',accent:'#ff9600',accentPress:'#e07c00',mascot:'#5cc7f5',belly:'#bfe8fb',leaf:'#3aa0e0'},
  berry:{primary:'#a560f0',press:'#8a45d6',accent:'#ff5fa2',accentPress:'#e63f88',mascot:'#c48ff5',belly:'#e9d4ff',leaf:'#ff5fa2'},
};
const SCALEMAP = { cozy:0.9, default:1, large:1.15, xl:1.32 };
const STORE = 'quizmachine.v3';
const PRAISE=["That's right!","Good job!","Brilliant!","Well done!","Exactly!","Sharp thinking!","Nailed it!","Superb!"];
const PRAISE_MOOD=['thumbsup','cheer','clap','wink','proud'];
const OOPS=["Oh no…","Not quite.","Close one!","Hmm — let's review.","Almost there!"];
const OOPS_MOOD=['oops','sad'];
const MOTIVATE=["You can do it!","Let's go!","Focus — you've got this.","Show me what you know!"];
const GREAT=["Outstanding!","Magnificent!","Top marks!","A scholar indeed!"];
const rand=(a)=>a[Math.floor(Math.random()*a.length)];
const CFG=(typeof window!=='undefined'&&window.QM_CONFIG)||{};
const AVATARS=['#58cc02,#3a9e00','#1cb0f6,#1391d3','#a560f0,#8a45d6','#ff9600,#e07c00','#ff5fa2,#e63f88','#ffc800,#e0a800','#14b8a6,#0d9488','#f43f5e,#e11d48','#6366f1,#4338ca','#0ea5e9,#0369a1'];
const RANKS=['Novice','Apprentice','Scholar','Adept','Expert','Master','Sage','Luminary','Virtuoso','Legend'];
const GOALS=[{k:'casual',label:'Casual',merit:10,sub:'10 Merit / day'},{k:'regular',label:'Regular',merit:30,sub:'30 Merit / day'},{k:'serious',label:'Serious',merit:50,sub:'50 Merit / day'},{k:'intense',label:'Intense',merit:80,sub:'80 Merit / day'}];
const BADGES=[
  {id:'first',name:'First Steps',desc:'Finish your first lesson',ic:'🌱'},
  {id:'streak3',name:'On a Roll',desc:'Reach a 3-day streak',ic:'🔥'},
  {id:'streak7',name:'Unstoppable',desc:'Reach a 7-day streak',ic:'⚡'},
  {id:'merit100',name:'Century',desc:'Earn 100 Merit',ic:'💯'},
  {id:'merit500',name:'High Achiever',desc:'Earn 500 Merit',ic:'🏆'},
  {id:'perfect',name:'Flawless',desc:'Score 100% on a lesson',ic:'⭐'},
  {id:'lessons10',name:'Dedicated',desc:'Complete 10 lessons',ic:'📚'},
  {id:'course',name:'Graduate',desc:'Complete a whole course',ic:'🎓'},
  {id:'level5',name:'Ascendant',desc:'Reach level 5',ic:'🚀'},
  {id:'review',name:'Comeback',desc:'Clear your review queue',ic:'🔁'},
];
const PEERS=[
  {name:'Mateo',av:'#1cb0f6,#1391d3',merit:640},{name:'Aisha',av:'#ff5fa2,#e63f88',merit:520},
  {name:'Kenji',av:'#a560f0,#8a45d6',merit:410},{name:'Lena',av:'#ffc800,#e0a800',merit:300},
  {name:'Diego',av:'#14b8a6,#0d9488',merit:220},{name:'Priya',av:'#f43f5e,#e11d48',merit:160},
  {name:'Omar',av:'#6366f1,#4338ca',merit:90},
];
const levelOf=(xp)=>Math.floor((xp||0)/120)+1;
const levelFloor=(lvl)=>(lvl-1)*120;
const rankOf=(xp)=>RANKS[Math.min(RANKS.length-1, levelOf(xp)-1)];
const todayKey=()=>new Date().toISOString().slice(0,10);
const configured=()=>{ const u=CFG.SUPABASE_URL||''; const k=CFG.SUPABASE_ANON_KEY||''; return /^https?:\/\//.test(u) && k.length>20 && !/YOUR_/.test(u+k); };

class Component extends DCLogic {
  state = {
    loading:true, error:null, data:null,
    auth:{status:'loading', user:null, mode: configured()?'supabase':'local'},
    authScreen:'login', authBusy:false, authError:null, authInfo:null,
    screen:'dashboard', quizIndex:null, lessonIndex:null,
    run:null, learn:null,
    xp:0, streak:{count:0,last:null,days:[]}, hearts:5,
    bestByLesson:{}, doneByLesson:{},
    profile:{ name:'', avatar:AVATARS[0], bio:'', goalKey:'regular', dailyGoal:30, mascotName:'The Professor', reminders:{on:false,time:'19:00'} },
    answeredByDay:{}, earnedByDay:{}, bookmarks:[], notes:{}, reviewQueue:[], recent:[], badges:[],
    settings:{ skin:'grass', dark:false, fontScale:'default', sound:true, narration:true, characters:true, reduceMotion:false },
    settingsOpen:false, sheetLesson:null, dashTab:'home',
    mascotMood:'idle', mascotLine:null, confetti:[], toast:null, lastResult:null,
  };

  /* ---------- lifecycle ---------- */
  componentDidMount(){
    this.applyTheme();
    fetch('quizzes.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(d=>{ if(!d||!Array.isArray(d.quizzes)) throw new Error('bad data'); this.setState({data:d, loading:false}); })
      .catch(e=>this.setState({error:e.message, loading:false}));
    try{ this.aRight = new Audio('assets/Right.wav'); this.aWrong = new Audio('assets/Wrong.wav'); this.aRight.volume=.7; this.aWrong.volume=.7; }catch(e){}
    this._key = (e)=>this.onKey(e);
    window.addEventListener('keydown', this._key);
    this.initAuth();
  }
  componentWillUnmount(){ window.removeEventListener('keydown', this._key); this.stopSpeech(); }

  get rm(){ return !!this.state.settings.reduceMotion; }

  /* ================= AUTH ================= */
  initAuth(){
    if(this.state.auth.mode==='supabase'){
      try{
        this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
        this.sb.auth.getSession().then(({data})=>{
          const u=data && data.session && data.session.user;
          if(u) this.onAuthed({id:u.id, email:u.email, name:(u.user_metadata&&u.user_metadata.name)||''});
          else this.setState({auth:{...this.state.auth, status:'out'}});
        });
        this.sb.auth.onAuthStateChange((_ev,session)=>{
          const u=session && session.user;
          if(u && this.state.auth.status!=='in') this.onAuthed({id:u.id,email:u.email,name:(u.user_metadata&&u.user_metadata.name)||''});
        });
        return;
      }catch(e){ /* fall back to local */ this.setState(st=>({auth:{...st.auth,mode:'local'}})); }
    }
    // local mode — restore last session
    const sess=this.lsGet('quizmachine.session');
    if(sess && sess.id) this.onAuthed(sess);
    else this.setState({auth:{status:'out', user:null, mode:'local'}});
  }
  lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  accounts(){ return this.lsGet('quizmachine.accounts')||{}; }
  hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return ''+h; }

  async signUp(email,password,name){
    email=(email||'').trim().toLowerCase();
    if(!/.+@.+\..+/.test(email)) return this.setState({authError:'Enter a valid email.'});
    if((password||'').length<6) return this.setState({authError:'Password needs 6+ characters.'});
    this.setState({authBusy:true, authError:null, authInfo:null});
    if(this.sb){
      const {data,error}=await this.sb.auth.signUp({email,password,options:{data:{name}}});
      if(error) return this.setState({authBusy:false, authError:error.message});
      if(!data.session) return this.setState({authBusy:false, authInfo:'Check your email to confirm, then log in.', authScreen:'login'});
      return; // onAuthStateChange handles it
    }
    const accs=this.accounts();
    if(accs[email]) return this.setState({authBusy:false, authError:'That email already has an account.'});
    accs[email]={id:'u_'+this.hash(email), email, pw:this.hash(password), name:name||''};
    this.lsSet('quizmachine.accounts', accs);
    this.onAuthed({id:accs[email].id, email, name:name||''});
  }
  async signIn(email,password){
    email=(email||'').trim().toLowerCase();
    this.setState({authBusy:true, authError:null, authInfo:null});
    if(this.sb){
      const {error}=await this.sb.auth.signInWithPassword({email,password});
      if(error) return this.setState({authBusy:false, authError:error.message});
      return;
    }
    const accs=this.accounts(); const a=accs[email];
    if(!a || a.pw!==this.hash(password||'')) return this.setState({authBusy:false, authError:'Wrong email or password.'});
    this.onAuthed({id:a.id, email, name:a.name});
  }
  async magicLink(email){
    email=(email||'').trim().toLowerCase();
    if(!/.+@.+\..+/.test(email)) return this.setState({authError:'Enter a valid email first.'});
    this.setState({authBusy:true, authError:null, authInfo:null});
    if(this.sb){
      const {error}=await this.sb.auth.signInWithOtp({email});
      this.setState({authBusy:false, authError:error?error.message:null, authInfo:error?null:'Magic link sent — check your email.'});
      return;
    }
    // local: treat as instant passwordless — find or create
    const accs=this.accounts(); let a=accs[email];
    if(!a){ a={id:'u_'+this.hash(email), email, pw:'', name:''}; accs[email]=a; this.lsSet('quizmachine.accounts',accs); }
    this.setState({authInfo:'(Local mode) signed in via magic link.'});
    this.onAuthed({id:a.id, email, name:a.name});
  }
  async googleSignIn(){
    this.setState({authError:null});
    if(this.sb){ await this.sb.auth.signInWithOAuth({provider:'google'}); return; }
    // local demo: create a sample google account
    const email='you@gmail.com';
    const accs=this.accounts(); let a=accs[email];
    if(!a){ a={id:'u_'+this.hash(email), email, pw:'', name:'Google User'}; accs[email]=a; this.lsSet('quizmachine.accounts',accs); }
    this.setState({authInfo:'(Local mode) demo Google sign-in.'});
    this.onAuthed({id:a.id, email, name:a.name});
  }
  guest(){
    const id='guest_'+Math.random().toString(36).slice(2,8);
    this.onAuthed({id, email:'', name:'', guest:true});
  }
  async signOut(){
    if(this.sb){ try{ await this.sb.auth.signOut(); }catch(e){} }
    this.lsSet('quizmachine.session', null);
    this.stopSpeech();
    this.setState({ auth:{status:'out', user:null, mode:this.state.auth.mode}, authScreen:'login',
      screen:'dashboard', run:null, learn:null,
      xp:0, streak:{count:0,last:null,days:[]}, bestByLesson:{}, doneByLesson:{},
      profile:{ name:'', avatar:AVATARS[0], bio:'', goalKey:'regular', dailyGoal:30, mascotName:'The Professor', reminders:{on:false,time:'19:00'} },
      answeredByDay:{}, earnedByDay:{}, bookmarks:[], notes:{}, reviewQueue:[], recent:[], badges:[] });
  }
  onAuthed(user){
    this.uid=user.id; this.userEmail=user.email;
    if(this.state.auth.mode==='local' && !user.guest) this.lsSet('quizmachine.session', user);
    this.setState({ auth:{status:'in', user, mode:this.state.auth.mode}, authBusy:false, authError:null }, ()=>{
      this.loadUserRecord(user);
    });
  }

  /* ---------- per-user persistence ---------- */
  userKey(){ return 'quizmachine.u.'+(this.uid||'anon'); }
  blankRecordFrom(user){
    return { xp:0, streak:{count:0,last:null,days:[]}, bestByLesson:{}, doneByLesson:{},
      profile:{ name:user.name||'', avatar:rand(AVATARS), bio:'', goalKey:'regular', dailyGoal:30, mascotName:'The Professor', reminders:{on:false,time:'19:00'}, onboarded:false },
      answeredByDay:{}, earnedByDay:{}, bookmarks:[], notes:{}, reviewQueue:[], recent:[], badges:[],
      settings:{ skin:'grass', dark:false, fontScale:'default', sound:true, narration:true, characters:true, reduceMotion:false } };
  }
  async loadUserRecord(user){
    let rec=null;
    if(this.sb){
      try{ const {data}=await this.sb.from('player_state').select('data').eq('id',user.id).maybeSingle(); if(data&&data.data) rec=data.data; }catch(e){}
    }
    if(!rec) rec=this.lsGet(this.userKey());
    if(!rec) rec=this.blankRecordFrom(user);
    this.applyRecord(rec);
  }
  applyRecord(rec){
    const bl=this.blankRecordFrom(this.state.auth.user||{});
    const profile={...bl.profile, ...(rec.profile||{})};
    if(!rec.profile && rec.name) profile.name=rec.name; // migrate old
    if(rec.profile && profile.onboarded===undefined) profile.onboarded=true; // existing users skip onboarding
    this.setState({
      xp:rec.xp||0, streak:rec.streak||bl.streak, bestByLesson:rec.bestByLesson||{}, doneByLesson:rec.doneByLesson||{},
      profile, answeredByDay:rec.answeredByDay||{}, earnedByDay:rec.earnedByDay||{},
      bookmarks:rec.bookmarks||[], notes:rec.notes||{}, reviewQueue:rec.reviewQueue||[], recent:rec.recent||[], badges:rec.badges||[],
      settings:{...bl.settings, ...(rec.settings||{})},
      screen: profile.onboarded? 'dashboard':'onboarding',
    }, ()=>{ this.applyTheme(); });
  }
  currentRecord(){
    const {xp,streak,bestByLesson,doneByLesson,profile,answeredByDay,earnedByDay,bookmarks,notes,reviewQueue,recent,badges,settings}=this.state;
    return {xp,streak,bestByLesson,doneByLesson,profile,answeredByDay,earnedByDay,bookmarks,notes,reviewQueue,recent,badges,settings};
  }
  persist(){
    if(this.state.auth.status!=='in') return;
    const rec=this.currentRecord();
    this.lsSet(this.userKey(), rec);
    if(this.sb && this.uid){
      clearTimeout(this._sbT);
      this._sbT=setTimeout(()=>{ try{ this.sb.from('player_state').upsert({id:this.uid,email:this.userEmail,data:rec,updated_at:new Date().toISOString()}); }catch(e){} }, 600);
    }
  }
  setProfile(patch){ this.setState(st=>({profile:{...st.profile,...patch}}), ()=>this.persist()); }

  /* ---------- theme ---------- */
  applyTheme(){
    const el = this.rootEl || document.documentElement;
    const s = (this.state && this.state.settings) || { skin:'grass', dark:false, fontScale:'default' };
    const sk = SKINS[s.skin]||SKINS.grass;
    const light = {bg:'#f4f8ec',surface:'#ffffff',surface2:'#f2f6ea',ink:'#4b5a44',inkStrong:'#2b3826',muted:'#93a487',line:'#e7ecdb',lineStrong:'#d6dfc4',correctBg:'#d7ffb8',correctInk:'#4a9e00',wrongBg:'#ffe0e1',wrongInk:'#ea2b2b',code:'#12261a',codeInk:'#a8e06a',shadow:'rgba(45,60,40,.10)'};
    const dark = {bg:'#12181a',surface:'#1b2427',surface2:'#232f31',ink:'#dbe6e0',inkStrong:'#ffffff',muted:'#8598a0',line:'#2b383b',lineStrong:'#3a4a4e',correctBg:'rgba(88,204,2,.16)',correctInk:'#8fe04e',wrongBg:'rgba(255,75,75,.18)',wrongInk:'#ff9090',code:'#0b1113',codeInk:'#9be86a',shadow:'rgba(0,0,0,.45)'};
    const b = s.dark?dark:light;
    const set=(k,v)=>{ try{ el.style.setProperty('--qm-'+k, v); }catch(e){} };
    set('bg',b.bg); set('surface',b.surface); set('surface2',b.surface2); set('ink',b.ink);
    set('inkStrong',b.inkStrong); set('muted',b.muted); set('line',b.line); set('lineStrong',b.lineStrong);
    set('correctBg',b.correctBg); set('correctInk',b.correctInk); set('wrongBg',b.wrongBg); set('wrongInk',b.wrongInk);
    set('code',b.code); set('codeInk',b.codeInk); set('shadow',b.shadow);
    set('primary',sk.primary); set('primaryPress',sk.press); set('accent',sk.accent); set('accentPress',sk.accentPress);
    set('mascot',sk.mascot); set('mascotBelly',sk.belly); set('leaf',sk.leaf);
    set('scale', SCALEMAP[s.fontScale]||1);
  }
  changeSetting(patch){
    this.setState(st=>({settings:{...st.settings,...patch}}), ()=>{ this.applyTheme(); this.persist(); });
  }

  /* ---------- speech + sound ---------- */
  speak(text){
    if(!this.state.settings.narration || !this.state.settings.sound) return;
    try{
      const synth = window.speechSynthesis; if(!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(String(text||'').slice(0,600));
      u.rate=1; u.pitch=1; synth.speak(u);
    }catch(e){}
  }
  stopSpeech(){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
  ding(ok){
    if(!this.state.settings.sound) return;
    try{ const a = ok?this.aRight:this.aWrong; if(a){ a.currentTime=0; a.play().catch(()=>{}); } }catch(e){}
  }
  toast(msg){ this.setState({toast:msg}); clearTimeout(this._tt); this._tt=setTimeout(()=>this.setState({toast:null}),2200); }

  /* ---------- data helpers ---------- */
  norm(s){ return String(s==null?'':s).trim().toLowerCase(); }
  asArr(v){ return Array.isArray(v)?v:(v==null?[]:[v]); }
  shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  quizStats(q){ const L=q.lessons||[]; return {lessons:L.length, questions:L.reduce((s,l)=>s+((l.questions||[]).length),0), cards:L.reduce((s,l)=>s+((l.lesson_content||[]).length),0)}; }

    const M={
      down:[sx+side*3,150,sx+side*9,120,'flat'], up:[sx+side*7,36,sx+side*17,60,'flat'],
      wave:[sx+side*17,58,sx+side*19,80,'flat'], thumb:[sx+side*9,112,sx+side*17,126,'thumb'],
      fist:[sx+side*3,62,sx+side*15,86,'fist'], chin:[66,80,sx+side*6,102,'flat'],
      hip:[sx-side*5,132,sx+side*11,118,'flat'], point:[sx+side*28,112,sx+side*17,104,'point'],
      out:[sx+side*26,138,sx+side*17,122,'flat'], cheek:[70+side*25,58,sx+side*15,80,'flat'],
      clap:[70+side*7,112,sx+side*5,110,'flat'], pointUp:[sx+side*7,44,sx+side*15,68,'flat'],
      book:[60+side*12,126,sx+side*8,122,'flat'],
    };

  typeLabel(t){ return {multiple_choice:'Choose one',true_false:'True or false',fill_in_the_blank:'Fill the blank',short_answer:'Short answer',matching_pairs:'Match the pairs'}[t||'multiple_choice']||'Question'; }

  questionBody(q,r){
    const type=q.type||'multiple_choice';
    if(type==='multiple_choice'||type==='true_false'){
      const list=this.optionList(q); const correct=this.asArr(q.correct_answer).map(x=>this.norm(x));
      return h('div',{style:{display:'grid',gap:'12px'}}, list.map((c,i)=>{
        const sel=this.norm(r.picked)===this.norm(c);
        let bd=T.line, bg=T.surface, fg=T.ink, sh=T.lineStrong, badge=null;
        if(!r.revealed && sel){ bd=T.accent; bg='color-mix(in srgb, var(--qm-accent) 12%, var(--qm-surface))'; sh=T.accent; }
        if(r.revealed){
          if(correct.includes(this.norm(c))){ bd=T.primary; bg=T.correctBg; fg=T.correctInk; sh=T.primary; badge='✓'; }
          else if(sel){ bd=T.red; bg=T.wrongBg; fg=T.wrongInk; sh=T.red; badge='✗'; }
        }
        return h('button',{key:i,onClick:()=>this.pick(c), disabled:r.revealed, style:{display:'flex',alignItems:'center',gap:'14px',textAlign:'left',padding:'16px 18px',borderRadius:'16px',border:'2px solid '+bd,background:bg,color:fg,boxShadow:'0 3px 0 '+sh,cursor:r.revealed?'default':'pointer',fontWeight:800,fontSize:this.fs(16),transition:'all .12s'}},[
          h('span',{key:'n',style:{width:'28px',height:'28px',borderRadius:'9px',border:'2px solid '+(sel||badge?bd:T.lineStrong),display:'grid',placeItems:'center',fontSize:'13px',fontWeight:900,color:sel||badge?bd:T.muted,flex:'0 0 auto'}}, badge||String(i+1)),
          h('span',{key:'t',style:{flex:1}}, c),
        ]);
      }));
    }
    if(type==='fill_in_the_blank'||type==='short_answer'){
      const big=type==='short_answer';
      return h(big?'textarea':'input',{
        value:r.picked||'', disabled:r.revealed, autoFocus:true,
        onChange:e=>this.pick(e.target.value),
        onKeyDown:e=>{ if(!big && e.key==='Enter'){ e.preventDefault(); if(!r.revealed&&this.canSubmit()) this.submit(); else if(r.revealed) this.next(); } },
        placeholder: big?'Write your answer…':'Type your answer…',
        style:{width:'100%',padding:'16px 18px',borderRadius:'16px',border:'2px solid '+(r.revealed?(r.correct?T.primary:T.red):T.line),background:r.revealed?(r.correct?T.correctBg:T.wrongBg):T.surface,color:T.inkStrong,fontFamily:'Nunito',fontWeight:700,fontSize:this.fs(17),minHeight:big?'130px':'auto',resize:'vertical',outline:'none',boxShadow:'0 3px 0 '+T.lineStrong},
      });
    }
    if(type==='matching_pairs'){
      const key=q.correct_answer||{}; const terms=(q.choices&&q.choices.terms)||Object.keys(key);
      const defs=(q.choices&&q.choices.definitions)||Object.values(key);
      if(!this._matchOpts || this._matchKey!==(q.question_text+r.idx)){ this._matchOpts=this.shuffle(defs); this._matchKey=q.question_text+r.idx; }
      const opts=this._matchOpts;
      return h('div',{style:{display:'grid',gap:'12px'}}, terms.map((term,i)=>{
        const val=r.matches[term]||''; let bd=T.line;
        if(r.revealed) bd = this.norm(val)===this.norm(key[term])?T.primary:T.red;
        return h('div',{key:i,style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',alignItems:'center'}},[
          h('div',{key:'t',style:{padding:'15px 16px',borderRadius:'14px',background:T.surface2,border:'2px solid '+T.line,fontWeight:900,color:T.inkStrong,fontSize:this.fs(15)}}, term),
          h('select',{key:'s',value:val,disabled:r.revealed,onChange:e=>this.setMatch(term,e.target.value),style:{padding:'15px 16px',borderRadius:'14px',border:'2px solid '+bd,background:T.surface,color:T.ink,fontFamily:'Nunito',fontWeight:700,fontSize:this.fs(15),cursor:r.revealed?'default':'pointer',outline:'none'}},
            [h('option',{key:'d',value:''},'Choose…')].concat(opts.map((d,j)=>h('option',{key:j,value:d},d)))),
        ]);
      }));
    }
    return h('p',{style:{color:T.muted}}, 'Unsupported question type.');
  }

  feedbackBar(q,r){
    const bg = !r.revealed? T.surface : (r.correct? T.correctBg : T.wrongBg);
    const brd = !r.revealed? T.line : (r.correct? T.primary : T.red);
    let content;
    if(!r.revealed){
      content=h('div',{style:{display:'flex',alignItems:'center',gap:'16px',flexWrap:'wrap'}},[
        h('div',{key:'hint',style:{color:T.muted,fontWeight:700,fontSize:'14px',flex:1,minWidth:'160px'}}, 'Pick your answer, then check. ⌨ 1–4 to pick · Enter to check'),
        this.btn('Check',()=>this.submit(),{key:'c',disabled:!this.canSubmit()}),
      ]);
    } else {
      const ink = r.correct? T.correctInk : T.wrongInk;
      const correctVals=this.asArr(q.correct_answer);
      let ansStr;
      if((q.type||'')==='matching_pairs') ansStr=Object.entries(q.correct_answer||{}).map(([t,d])=>t+' → '+d).join('  ·  ');
      else ansStr=correctVals.join(', ');
      content=h('div',{style:{display:'flex',alignItems:'center',gap:'18px',flexWrap:'wrap'}},[
        h('div',{key:'i',style:{width:'46px',height:'46px',borderRadius:'50%',background:r.correct?T.primary:T.red,color:'#fff',display:'grid',placeItems:'center',fontSize:'26px',fontWeight:900,flex:'0 0 auto'}}, r.correct?'✓':'✗'),
        h('div',{key:'t',style:{flex:1,minWidth:'180px'}},[
          h('div',{key:'h',style:{fontWeight:900,fontSize:'19px',color:ink}}, r.correct?'Nice work!':'Correct answer'),
          h('div',{key:'a',style:{fontWeight:800,color:ink,marginTop:'2px',fontSize:'15px'}}, r.correct? (q.explanation? q.explanation : 'Keep it up.') : ansStr),
          (!r.correct && q.explanation)? h('div',{key:'e',style:{fontWeight:600,color:T.ink,marginTop:'6px',fontSize:'14px',lineHeight:1.5,opacity:.85}}, q.explanation):null,
        ]),
        this.btn(r.idx+1>=r.list.length?'See results':'Continue', ()=>this.next(), {key:'n', variant:r.correct?'primary':'danger'}),
      ]);
    }
    return h('div',{style:{borderTop:'2px solid '+brd,background:bg,transition:'background .2s',position:'sticky',bottom:0,zIndex:20,boxShadow:'0 -6px 20px var(--qm-shadow)'}}, this.wrap(h('div',{style:{padding:'18px 0'}},content),720));
  }

      ring, stats, btns,

  /* ================= AUTH / ONBOARDING / DASHBOARD ================= */
  renderApp(){
    const a=this.state.auth;
    if(a.status==='loading') return this.splashScreen();
    if(a.status!=='in') return this.authScreen();
    if(this.state.loading) return this.splashScreen();
    if(!this.state.profile.onboarded) return this.onboardingScreen();
    return h('div',{key:'app',style:{display:'flex',flexDirection:'column',minHeight:'100vh'}}, [
      this.renderChrome(),
      h('div',{key:'main',style:{flex:1,display:'flex',flexDirection:'column'}}, this.renderBody()),

  computeBadges(rec){
    rec=rec||this.state;
    const done=Object.keys(rec.doneByLesson||{}).length;
    const perfect=Object.values(rec.bestByLesson||{}).some(v=>v>=100);
    const xp=rec.xp||0; const lvl=levelOf(xp); const streak=(rec.streak&&rec.streak.count)||0;
    const out=[];
    if(done>=1)out.push('first'); if(streak>=3)out.push('streak3'); if(streak>=7)out.push('streak7');
    if(xp>=100)out.push('merit100'); if(xp>=500)out.push('merit500'); if(perfect)out.push('perfect');
    if(done>=10)out.push('lessons10'); if(this.courseCompleted(rec))out.push('course'); if(lvl>=5)out.push('level5');
    if(done>=1 && (rec.reviewQueue||[]).length===0)out.push('review');
    return out;
  }
  courseCompleted(rec){ if(!this.state.data)return false; return this.state.data.quizzes.some(q=>q.lessons.length && q.lessons.every(l=>(rec.doneByLesson||{})[this.lkey(q.quiz_name,l.lesson_name)]!=null)); }

  startCustomRun(list,label){
    if(!list||!list.length){ this.toast(label==='Bookmarks'?'No bookmarks yet':'Nothing to review — nice!'); return; }
    this.stopSpeech();
    this.setState({screen:'quiz', quizIndex:null, lessonIndex:null, hearts:5, mascotMood:'wave', mascotLine:rand(MOTIVATE),

  finishCustom(){
    const r=this.state.run; const total=r.answers.length, right=r.answers.filter(a=>a.correct).length; const pct=total?Math.round(right/total*100):0; const wrong=r.answers.filter(a=>!a.correct).map(a=>a.q);

    let streak={...this.state.streak,days:(this.state.streak.days||[]).slice()};

    this.setState({screen:'results', streak, recent,

  }

      h('span',{key:'d',style:{width:'10px',height:'10px',borderRadius:'50%',background:r.c,flex:'0 0 auto'}}),
      h('div',{key:'t',style:{flex:1,minWidth:0}},[h('div',{key:1,style:{fontWeight:900,color:T.inkStrong,fontSize:'13.5px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.t),h('div',{key:2,style:{fontWeight:700,color:T.muted,fontSize:'12px'}},r.s)]),
      h('span',{key:'a',style:{color:T.muted,fontWeight:900}},'→'),
    ])));
  }
  mastery(){
    const courses=this.state.data.quizzes;
    const rows=courses.map(q=>{ const keys=q.lessons.map(l=>this.lkey(q.quiz_name,l.lesson_name)).filter(k=>this.state.bestByLesson[k]!=null); if(!keys.length)return null; const avg=Math.round(keys.reduce((s,k)=>s+this.state.bestByLesson[k],0)/keys.length); return {name:q.quiz_name,avg}; }).filter(Boolean).sort((a,b)=>b.avg-a.avg).slice(0,5);
    if(!rows.length) return h('div',{style:{color:T.muted,fontWeight:700}},'Complete lessons to see your mastery.');
    return h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}}, rows.map((r,i)=>h('div',{key:i},[
      h('div',{key:'r',style:{display:'flex',justifyContent:'space-between',fontWeight:800,fontSize:'13px',color:T.ink,marginBottom:'3px'}},[h('span',{key:1,style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},r.name),h('span',{key:2,style:{color:r.avg>=80?T.correctInk:r.avg>=50?'#c79600':T.wrongInk}},r.avg+'%')]),
      h('div',{key:'b',style:{height:'8px',background:T.surface2,borderRadius:'999px',overflow:'hidden'}}, h('div',{style:{width:r.avg+'%',height:'100%',background:r.avg>=80?T.primary:r.avg>=50?T.gold:T.red}})),
    ])));
  }

  /* ================= renderVals ================= */
  renderVals(){
    const hearts=Array.from({length:5},(_,i)=>({ style:'fill:'+(i<this.state.hearts?T.red:T.line) }));
    return {
      rootRef:(el)=>{ if(el){ this.rootEl=el; this.applyTheme(); } },
      app:this.renderApp(),
      // legacy hidden-header holes (kept to avoid unresolved-hole warnings)
      goHome:()=>this.goHome(), brandMark:this.miniMark(),
      streakCount:this.state.streak.count||0, xpTotal:this.num(this.state.xp),
      heartSlots:hearts, toggleSettings:()=>this.setState(st=>({settingsOpen:!st.settingsOpen})),
      body:null, overlays:null,
    };
  }
}

</script>
<script>
// Mount the app
const rootEl = document.getElementById('root');
const reactRoot = ReactDOM.createRoot(rootEl);
reactRoot.render(React.createElement(Component, null));
</script>
