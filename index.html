<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<title>Analyst Academy</title>
<style>
:root {
  --bg:#F7F9FA; --surface:#FFFFFF; --border:#E5E5E5;
  --text-hi:#202124; --text-mid:#6B6B6B; --text-lo:#6C6C6C; --text-body:#3C3C3C;
  --chip-bg:#F0F0F0; --chip-fg:#575757; --danger:#D92C2C;
  --node-locked-bg:#E5E5E5; --node-locked-sh:#C9C9C9; --node-locked-txt:#B9B9B9;
  --caption-locked:#BEBEBE; --track-bg:#E5E5E5;
  --code-bg:#F3F4F6; --code-border:#E5E7EB; --code-fg:#1F2937;
  --blockquote-border:#E5E5E5;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1117; --surface:#1C2130; --border:#2D3348;
  --text-hi:#F0F2F5; --text-mid:#B8C0CC; --text-lo:#8B95A4; --text-body:#CDD4DF;
  --chip-bg:#262D3D; --chip-fg:#B8C0CC; --danger:#FF4B4B;
  --node-locked-bg:#2D3348; --node-locked-sh:#1E2534; --node-locked-txt:#4A5568;
  --caption-locked:#4A5568; --track-bg:#2D3348;
  --code-bg:#161B27; --code-border:#2D3348; --code-fg:#E2E8F0;
  --blockquote-border:#2D3348;
}}
:root[data-theme="light"]{
  --bg:#F7F9FA; --surface:#FFFFFF; --border:#E5E5E5;
  --text-hi:#202124; --text-mid:#6B6B6B; --text-lo:#6C6C6C; --text-body:#3C3C3C;
  --chip-bg:#F0F0F0; --chip-fg:#575757; --danger:#D92C2C;
  --node-locked-bg:#E5E5E5; --node-locked-sh:#C9C9C9; --node-locked-txt:#B9B9B9;
  --caption-locked:#BEBEBE; --track-bg:#E5E5E5;
  --code-bg:#F3F4F6; --code-border:#E5E7EB; --code-fg:#1F2937;
  --blockquote-border:#E5E5E5;
}
:root[data-theme="dark"]{
  --bg:#0F1117; --surface:#1C2130; --border:#2D3348;
  --text-hi:#F0F2F5; --text-mid:#B8C0CC; --text-lo:#8B95A4; --text-body:#CDD4DF;
  --chip-bg:#262D3D; --chip-fg:#B8C0CC; --danger:#FF4B4B;
  --node-locked-bg:#2D3348; --node-locked-sh:#1E2534; --node-locked-txt:#4A5568;
  --caption-locked:#4A5568; --track-bg:#2D3348;
  --code-bg:#161B27; --code-border:#2D3348; --code-fg:#E2E8F0;
  --blockquote-border:#2D3348;
}

*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'Nunito',system-ui,sans-serif;color:var(--text-body);min-height:100vh;padding-bottom:80px;}
button{font-family:inherit;cursor:pointer;}
::selection{background:#DDF4C7;}

@keyframes crPulse{
  0%,100%{box-shadow:0 6px 0 var(--node-shadow,#46A302),0 0 0 0 rgba(88,204,2,.35);}
  50%{box-shadow:0 6px 0 var(--node-shadow,#46A302),0 0 0 10px rgba(88,204,2,0);}
}
/* Expanding rings marking the next node to do. Two rings offset in time read as
   a ripple; --ripple is set inline so it matches each track's colour. */
@keyframes crRipple{
  0%{transform:scale(1);opacity:.7;}
  70%{opacity:.12;}
  100%{transform:scale(1.85);opacity:0;}
}
@keyframes crPop{from{transform:scale(.84);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:2px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:14px 28px;gap:16px;}
.topbar-logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;border-radius:10px;background:#58CC02;box-shadow:0 3px 0 #46A302;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px;flex-shrink:0;}
.logo-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;color:var(--text-hi);letter-spacing:.2px;}
.topbar-stats{display:flex;align-items:center;gap:22px;}
.stat{display:flex;align-items:center;gap:8px;}
.stat-pip{width:16px;height:16px;border-radius:50%;flex-shrink:0;}
.stat-gem{width:16px;height:16px;border-radius:4px;transform:rotate(45deg);flex-shrink:0;}
.stat-val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:16px;color:var(--text-hi);font-variant-numeric:tabular-nums;}
.stat-lbl{font-size:12px;color:var(--text-lo);font-weight:700;}

/* ── Track tabs ── */
.tracks{max-width:720px;margin:20px auto 0;padding:0 20px;display:flex;gap:10px;}
.track-tab{flex:1;text-align:center;padding:13px 10px;border-radius:14px;border:2px solid var(--border);background:var(--surface);color:var(--text-mid);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;text-decoration:none;transition:all .15s ease;}
.track-tab:hover{filter:brightness(1.04);}
/* Active-tab accent comes from the track registry as an inline style, so a new
   track needs no CSS of its own. This rule is only the fallback. */
.track-tab.active{border-color:#58CC02;color:#58CC02;background:rgba(88,204,2,.08);box-shadow:0 3px 0 rgba(70,163,2,.35);}
@media(max-width:560px){.tracks{flex-wrap:wrap;}.track-tab{font-size:13px;padding:11px 8px;}}

/* ── Hero ── */
.hero{max-width:720px;margin:0 auto;padding:32px 20px 8px;}
.hero h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:30px;color:var(--text-hi);text-wrap:balance;margin:0;}
.hero-sub{font-size:15px;color:var(--text-mid);margin-top:6px;font-weight:600;text-wrap:pretty;line-height:1.5;}
.progress-card{margin-top:20px;background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px 18px;}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-lbl{font-weight:800;font-size:13px;color:var(--text-hi);}
.progress-cnt{font-weight:800;font-size:13px;color:#58CC02;font-variant-numeric:tabular-nums;}
.progress-track{height:14px;border-radius:8px;background:var(--track-bg);overflow:hidden;}
.progress-fill{height:100%;border-radius:8px;background:#58CC02;transition:width .4s ease;}
.framework{margin-top:24px;}
.framework-lbl{font-weight:800;font-size:13px;color:var(--text-lo);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--chip-bg);color:var(--chip-fg);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:20px;}

/* ── Path ── */
.path{max-width:720px;margin:36px auto 0;padding:0 20px;}
.unit{margin-bottom:44px;}
.unit-banner{border-radius:16px;padding:16px 20px;margin-bottom:34px;color:#fff;}
.unit-kicker{font-size:12px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px;}
.unit-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;margin-top:2px;}
.unit-done{font-size:12.5px;font-weight:700;opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums;}
.nodes{display:flex;flex-direction:column;align-items:center;gap:26px;}

/* ── Unit accordion ──
   Every track's landing page (Credit Risk parts, DV groups, BA chapters, Quiz
   Practice banks) used to render as one long continuous path: every unit's
   full banner and full node list, always visible, all the way down the page.
   Cleaner minimized: each unit is a thin collapsible bar, and clicking it
   expands that unit's own path inline. Independent per-unit state
   (S.expandedOverride, keyed by "trackId:unitIndex"), not a single-open
   accordion — more than one unit can be open at a time.
   Quiz Practice's banks are peers (no bank depends on another finishing
   first), so nothing auto-expands there. Credit Risk/DV/BA have a real
   current position, so renderUnitAccordion auto-opens whichever unit holds
   the first not-yet-complete lesson, unless the user has explicitly
   collapsed it (see isUnitOpen). */
.unit-list{max-width:760px;margin:28px auto 0;padding:0 20px;}
.unit-row{margin-bottom:14px;border-radius:14px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.14);}
.unit-bar{width:100%;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;gap:12px;
  padding:12px 18px;text-align:left;font-family:inherit;}
.unit-bar-num{font-size:11px;font-weight:800;opacity:.8;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.unit-bar-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;flex:1;line-height:1.2;}
.unit-bar-meta{font-size:11.5px;font-weight:700;opacity:.9;white-space:nowrap;}
.unit-bar-caret{font-size:13px;opacity:.85;transition:transform .15s;}
.unit-row.expanded .unit-bar-caret{transform:rotate(90deg);}
.unit-row.expanded .unit-bar{box-shadow:inset 0 -1px 0 rgba(255,255,255,.25);}
.unit-body{background:var(--surface);padding:24px 20px 6px;}
.unit-body .path{margin-top:0;padding:0;max-width:none;}
.unit-body .unit{margin-bottom:8px;}

/* ── The Teacher ──
   position:fixed, not part of the lesson-page flow — a floating chat widget
   anchored to the viewport's bottom-right, like the rest of the web treats
   "chat with support/agent." No ancestor here sets transform/filter/contain
   persistently (only transient :hover states elsewhere in this file), so
   fixed positioning resolves against the viewport as expected, not some
   ancestor's box. */
.teacher-panel{position:fixed;right:20px;bottom:20px;width:380px;max-width:calc(100vw - 32px);max-height:min(600px,70vh);display:flex;flex-direction:column;border-radius:16px;border:2px solid var(--border);background:var(--surface);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.28);z-index:60;transition:width .15s ease,max-height .15s ease;}
/* Wide mode: the MCQ right/wrong feedback runs several sentences long, and
   380px wraps it into a tall, cramped column. Toggled per-session (not
   persisted, not per-lesson) via teacherToggleWide() — a plain preference,
   not conversation state. */
.teacher-panel.wide{width:min(900px,calc(100vw - 40px));max-height:min(720px,82vh);}
@media (max-width:640px){.teacher-wide-toggle{display:none;}}   /* already full-width there — see the panel's own mobile breakpoint below */
.teacher-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#7C4DFF;color:#fff;flex-shrink:0;}
.teacher-head-lbl{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;}
.teacher-head-sub{font-size:12px;font-weight:700;opacity:.85;margin-top:2px;}
.teacher-close{background:rgba(255,255,255,.22);border:none;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-weight:800;flex-shrink:0;}
.teacher-scroll{flex:1;min-height:200px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
.teacher-empty{color:var(--text-lo);font-size:13.5px;font-style:italic;}
.teacher-msg{display:flex;}
.teacher-msg.user{justify-content:flex-end;}
.teacher-bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
.teacher-msg.user .teacher-bubble{background:#7C4DFF;color:#fff;border-bottom-right-radius:4px;}
.teacher-msg.assistant .teacher-bubble{background:var(--track-bg);color:var(--text-hi);border-bottom-left-radius:4px;}
.teacher-thinking{opacity:.7;font-style:italic;}
.teacher-error{margin:0 18px 12px;padding:10px 14px;border-radius:10px;background:#FFE5E5;color:#B00020;font-size:13px;font-weight:600;flex-shrink:0;}
.teacher-input-row{display:flex;gap:10px;padding:14px 18px;border-top:2px solid var(--border);flex-shrink:0;}
.teacher-input-row textarea{flex:1;resize:none;height:44px;padding:10px 12px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text-hi);font-family:inherit;font-size:14px;}
.teacher-send{background:#7C4DFF;color:#fff;border:none;padding:0 20px;border-radius:10px;font-weight:800;cursor:pointer;}
.teacher-send:disabled,.teacher-input-row textarea:disabled{opacity:.5;cursor:not-allowed;}
/* Small screens: a corner card doesn't work at 375px wide — go full-width,
   docked to the bottom, so it reads as a bottom sheet instead of a postage
   stamp. */
@media (max-width:640px){
  .teacher-panel{left:12px;right:12px;bottom:12px;width:auto;max-width:none;max-height:75vh;}
}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.node-btn{border:none;display:flex;align-items:center;justify-content:center;padding:0;position:relative;}
.node-btn.is-next::before,.node-btn.is-next::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  border:3px solid var(--ripple,#58CC02);
  animation:crRipple 2.1s ease-out infinite;pointer-events:none;
}
.node-btn.is-next::after{animation-delay:1.05s;}
.next-badge{margin-top:3px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.7px;
  text-transform:uppercase;color:#fff;padding:2px 8px;border-radius:10px;}
.node-btn:hover{filter:brightness(1.07);}
.node-btn:focus-visible{outline:3px solid #58CC02;outline-offset:3px;}
.node-caption{font-size:11.5px;font-weight:700;max-width:120px;text-align:center;text-wrap:pretty;}

/* ── Modal overlay ── */
.overlay{position:fixed;inset:0;background:rgba(32,33,36,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}

/* ── Summary card (first view) ── */
.modal-card{background:var(--surface);border-radius:20px;max-width:460px;width:100%;max-height:86vh;overflow-y:auto;animation:crPop .18s ease-out;}
.modal-hd{padding:22px 24px;border-radius:20px 20px 0 0;position:relative;}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:rgba(255,255,255,.4);}
.modal-kicker{font-size:12px;font-weight:800;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.6px;}
.modal-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:#fff;margin-top:4px;text-wrap:pretty;}
.modal-badges{display:flex;gap:8px;margin-top:10px;}
.badge{background:rgba(255,255,255,.25);color:#fff;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:14px;}
.modal-bd{padding:22px 24px 26px;}
.modal-desc{font-size:14.5px;line-height:1.55;color:var(--text-mid);font-weight:600;margin:0 0 18px;text-wrap:pretty;}
.in-lesson-lbl{font-size:12px;font-weight:800;color:var(--text-lo);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.modal-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.modal-chip{background:var(--chip-bg);color:var(--chip-fg);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;}
.action-btn{width:100%;padding:15px;border:none;border-radius:14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px;}
.action-btn:hover{filter:brightness(1.06);}
.action-btn.undone{background:var(--chip-bg)!important;color:var(--text-lo)!important;box-shadow:none!important;}
.open-lesson-btn{width:100%;padding:13px;border:2px solid var(--border);border-radius:14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px;background:transparent;color:var(--text-hi);display:flex;align-items:center;justify-content:center;gap:8px;}
.open-lesson-btn:hover{background:var(--chip-bg);}

/* ── Full lesson reader ── */
.reader{background:var(--surface);border-radius:20px;max-width:860px;width:100%;max-height:90vh;display:flex;flex-direction:column;animation:crPop .18s ease-out;}
.reader-hd{padding:18px 24px;border-radius:20px 20px 0 0;position:relative;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.reader-back{background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.reader-back:hover{background:rgba(255,255,255,.35);}
.reader-title{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;color:#fff;flex:1;text-wrap:pretty;}
.reader-close{background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:800;font-size:15px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.reader-close:hover{background:rgba(255,255,255,.4);}
.reader-body{overflow-y:auto;padding:28px 32px 36px;flex:1;}

/* ── Markdown styles ── */
.md h1,.md h2,.md h3,.md h4{font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--text-hi);margin:1.6em 0 .5em;line-height:1.25;}
.md h1{font-size:24px;margin-top:.5em;}
.md h2{font-size:20px;border-bottom:2px solid var(--border);padding-bottom:8px;}
.md h3{font-size:16px;}
.md h4{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-lo);}
.md p{margin:.6em 0 1em;line-height:1.65;font-size:14.5px;}
.md ul,.md ol{padding-left:22px;margin:.5em 0 1em;}
.md li{margin:.3em 0;line-height:1.6;font-size:14.5px;}
.md code{font-family:'Courier New',monospace;font-size:13px;background:var(--code-bg);color:var(--code-fg);padding:2px 6px;border-radius:5px;border:1px solid var(--code-border);}
.md pre{background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;padding:16px 18px;overflow-x:auto;margin:1em 0;}
.md pre code{background:none;border:none;padding:0;font-size:13px;line-height:1.6;}
.md blockquote{border-left:4px solid var(--blockquote-border);margin:1em 0;padding:.5em 1em;color:var(--text-mid);}
.md table{width:100%;border-collapse:collapse;margin:1em 0;font-size:13.5px;}
.md th{background:var(--chip-bg);color:var(--text-hi);font-weight:800;padding:8px 12px;text-align:left;border:1px solid var(--border);}
.md td{padding:7px 12px;border:1px solid var(--border);line-height:1.5;}
.md tr:nth-child(even) td{background:var(--bg);}
.md hr{border:none;border-top:2px solid var(--border);margin:2em 0;}
.md strong{font-weight:800;color:var(--text-hi);}
.md a{color:#1CB0F6;text-decoration:none;}
.md a:hover{text-decoration:underline;}

.reader-footer{padding:16px 24px;border-top:2px solid var(--border);display:flex;gap:10px;flex-shrink:0;}
.reader-complete{flex:1;padding:13px;border:none;border-radius:14px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:14px;cursor:pointer;}
.reader-complete:hover{filter:brightness(1.06);}
.reader-complete.undone{background:var(--chip-bg)!important;color:var(--text-lo)!important;box-shadow:none!important;}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;color:var(--text-mid);font-weight:700;}
.spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:#58CC02;border-radius:50%;animation:spin .8s linear infinite;}

/* ── Quiz session ── */
.quiz-wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px;}
.quiz-bar{height:12px;border-radius:8px;background:var(--track-bg);overflow:hidden;margin-bottom:22px;}
.quiz-bar-fill{height:100%;border-radius:8px;background:#FF9600;transition:width .3s ease;}
.quiz-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;font-size:12.5px;color:var(--text-lo);}
/* pre-wrap: some questions embed multi-line SQL/Python whose line breaks matter */
.quiz-q{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21px;color:var(--text-hi);line-height:1.35;margin:8px 0 22px;white-space:pre-wrap;}
.quiz-q code,.quiz-choice code,.quiz-fb code{font-family:'Courier New',monospace;font-size:.88em;background:var(--code-bg);color:var(--code-fg);padding:1px 5px;border-radius:4px;border:1px solid var(--code-border);white-space:normal;}
.quiz-choices{display:flex;flex-direction:column;gap:11px;}
.quiz-choice{width:100%;text-align:left;padding:15px 18px;border:2px solid var(--border);border-bottom-width:4px;border-radius:14px;background:var(--surface);color:var(--text-body);font-weight:700;font-size:15px;line-height:1.45;transition:all .12s ease;}
.quiz-choice:hover:not(:disabled){border-color:#84D8FF;background:rgba(28,176,246,.06);}
.quiz-choice.selected{border-color:#1CB0F6;background:rgba(28,176,246,.12);color:#1899D6;}
.quiz-choice.correct{border-color:#58CC02;background:rgba(88,204,2,.15);color:#3F8F02;}
.quiz-choice.wrong{border-color:#FF4B4B;background:rgba(255,75,75,.12);color:#D93030;}
.quiz-choice:disabled{cursor:default;}
.quiz-fb{margin-top:20px;padding:16px 18px;border-radius:14px;font-weight:700;font-size:14.5px;line-height:1.55;}
.quiz-fb.good{background:rgba(88,204,2,.13);color:#3F8F02;}
.quiz-fb.bad{background:rgba(255,75,75,.11);color:#C62B2B;}

.plan-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--text-lo);flex:0 0 auto;text-decoration:none;}

const mdCache={};

function loadState(){
  try{
    const sv=JSON.parse(localStorage.getItem('crAcademy_v1')||'{}');
    const completed=sv.completed||{};
    const today=new Date().toDateString();
    let streak=sv.streak||1;
    if(sv.lastDate&&sv.lastDate!==today){
      const diff=Math.round((new Date(today)-new Date(sv.lastDate))/86400000);
      streak=diff===1?streak+1:1;
    }else if(!sv.lastDate){streak=1;}
    const quizScores=sv.quizScores||{};
    localStorage.setItem('crAcademy_v1',JSON.stringify({completed,streak,lastDate:today,quizScores}));
    S.completed=completed;S.streak=streak;S.quizScores=quizScores;
  }catch(e){}
}
function saveCompleted(c){
  try{
    const sv=JSON.parse(localStorage.getItem('crAcademy_v1')||'{}');
    localStorage.setItem('crAcademy_v1',JSON.stringify({...sv,completed:c}));
  }catch(e){}
}
function saveQuizScore(id,pct){
  const prev=S.quizScores[id];
  if(prev!==undefined&&prev>=pct)return;
  S.quizScores[id]=pct;
  try{
    const sv=JSON.parse(localStorage.getItem('crAcademy_v1')||'{}');
    localStorage.setItem('crAcademy_v1',JSON.stringify({...sv,quizScores:S.quizScores}));
  }catch(e){}
}

/* ── Backup and restore ──
   Progress lives only in localStorage, so clearing site data wipes it and nothing
   moves between devices. This makes it recoverable without a backend or an account.

   The payload carries EXACTLY the keys loadState() writes and no more. loadState
   rebuilds crAcademy_v1 from a whitelist {completed,streak,lastDate,quizScores},
   so any extra key restored here would be silently dropped on the next boot —
   which would look like a restore that half-worked.

   Import MERGES, never replaces. A restore must not be able to destroy progress
   that is newer than the file, since the whole point of the feature is not losing
   work. Merging is safe because progress here is monotonic. */
const BACKUP_APP='analyst-academy';
const BACKUP_VERSION=1;
const BACKUP_MAX_BYTES=4*1024*1024;   // ~4MB; a full-progress backup is far under 1MB

function currentState(){
  try{return JSON.parse(localStorage.getItem('crAcademy_v1')||'{}');}catch(e){return {};}
}
function backupPayload(){
  const sv=currentState();
  const completed=sv.completed||{};
  const quizScores=sv.quizScores||{};
  return {
    app:BACKUP_APP,
    version:BACKUP_VERSION,
    exportedAt:new Date().toISOString(),
    // Plain-text summary so the file says what it holds without a code editor.
    summary:{
      lessonsCompleted:Object.keys(completed).length,
      quizLessonsScored:Object.keys(quizScores).length,
      dayStreak:sv.streak||1,
      lastStudied:sv.lastDate||null
    },
    state:{completed,streak:sv.streak||1,lastDate:sv.lastDate||null,quizScores}
  };
}
/* Validate fully BEFORE touching storage: a rejected file must leave progress
   byte-identical. Returns an error string, or null when the payload is usable. */
function validateBackup(obj){
  if(!obj||typeof obj!=='object')return 'That file is not a backup object.';
  if(obj.app!==BACKUP_APP)return 'That file is not an Analyst Academy backup.';
  if(typeof obj.version!=='number')return 'That backup has no version number.';
  if(obj.version>BACKUP_VERSION)return `That backup was made by a newer version (v${obj.version}). Update the app first.`;
  const st=obj.state;
  // Arrays are objects, so an array would slip past a bare typeof check.
  if(!st||typeof st!=='object'||Array.isArray(st))return 'That backup has no progress in it.';
  if(st.completed!==undefined&&(typeof st.completed!=='object'||st.completed===null||Array.isArray(st.completed)))return 'The completed list in that backup is malformed.';
  if(st.quizScores!==undefined&&(typeof st.quizScores!=='object'||st.quizScores===null||Array.isArray(st.quizScores)))return 'The quiz scores in that backup are malformed.';
  return null;
}
/* Union for completed, max per id for quizScores (matching saveQuizScore), max
   streak, later lastDate. Nothing can be removed by a restore. */
function mergeBackup(obj){
  const cur=currentState();
  const cc={...(cur.completed||{})}, cq={...(cur.quizScores||{})};
  const ic=obj.state.completed||{}, iq=obj.state.quizScores||{};
  let addedLessons=0, addedScores=0;
  Object.keys(ic).forEach(k=>{if(ic[k]&&!cc[k]){cc[k]=true;addedLessons++;}});
  Object.keys(iq).forEach(k=>{
    const v=Number(iq[k]);
    if(!isFinite(v))return;
    if(cq[k]===undefined||v>cq[k]){cq[k]=v;addedScores++;}
  });
  const streak=Math.max(Number(cur.streak)||1,Number(obj.state.streak)||1);
  const dates=[cur.lastDate,obj.state.lastDate].filter(Boolean)
    .sort((a,b)=>new Date(b)-new Date(a));
  const merged={completed:cc,streak,lastDate:dates[0]||cur.lastDate||null,quizScores:cq};
  // A single setItem, so a quota failure throws before anything is replaced and
  // the previous value survives intact. Read it back rather than trusting the
  // write: storage can be full, or disabled entirely in private browsing, and
  // loadState() below swallows its own write failure by design.
  localStorage.setItem('crAcademy_v1',JSON.stringify(merged));
  const back=currentState();
  if(Object.keys(back.completed||{}).length!==Object.keys(cc).length){
    throw new Error('the browser did not keep the restored data (storage may be full)');
  }
  loadState();
  return {addedLessons,addedScores,totalLessons:Object.keys(cc).length};
}

/* ── Start fresh ──
   Two steps in the page, not a browser confirm() and not a modal: the first

   without a second, deliberate click on a differently-worded button. */
function armReset(){S.resetArm=true;S.backupMsg=null;render();}
function cancelReset(){S.resetArm=false;render();}
function doReset(){
  try{
    localStorage.removeItem('crAcademy_v1');
    S.completed={};S.quizScores={};S.streak=1;
    // A quiz in flight lives in S.session and is reused whenever the route's
    // qi/li still match, so without this a reset leaves you mid-quiz with your
    // old score — "start fresh" would not be fresh.
    S.session=null;
    loadState();
    S.resetArm=false;
    S.backupMsg={kind:'ok',text:'Progress cleared. You are back at the first lesson of every track.'};
  }catch(e){
    S.resetArm=false;
    S.backupMsg={kind:'err',text:'Could not clear progress: '+e.message};
  }
  render();
}
function renderResetCard(s){

function downloadBackup(){
  try{
    const data=JSON.stringify(backupPayload(),null,2);
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url;
    a.download='analyst-academy-progress-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),0);
    S.backupMsg={kind:'ok',text:'Backup downloaded. Keep it somewhere outside this browser.'};
  }catch(e){
    S.backupMsg={kind:'err',text:'Could not create the file: '+e.message};
  }
  render();
}
function importBackupFile(input){
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  // Gate on size before reading. A real backup of every lesson in the app is a
  // few hundred KB; anything far larger is a wrong file or a hostile one, and
  // parsing it would stall the tab before validation ever runs.
  if(file.size>BACKUP_MAX_BYTES){
    S.backupMsg={kind:'err',text:`That file is ${Math.round(file.size/1048576)} MB. A progress backup is well under 1 MB, so this is not one.`};
    render();return;
  }
  S.backupMsg={kind:'busy',text:'Reading '+file.name+'…'};render();
  const reader=new FileReader();
  reader.onerror=()=>{S.backupMsg={kind:'err',text:'That file could not be read.'};render();};
  reader.onload=()=>{
    let obj=null;
    try{obj=JSON.parse(reader.result);}
    catch(e){S.backupMsg={kind:'err',text:'That file is not valid JSON.'};render();return;}
    const bad=validateBackup(obj);
    if(bad){S.backupMsg={kind:'err',text:bad};render();return;}
    try{
      const r=mergeBackup(obj);
      S.backupMsg={kind:'ok',text:`Restored. ${r.addedLessons} new lesson${r.addedLessons===1?'':'s'} and ${r.addedScores} quiz score${r.addedScores===1?'':'s'} merged in — ${r.totalLessons} completed in total. Nothing was removed.`};
    }catch(e){
      S.backupMsg={kind:'err',text:'Restore failed, and your progress was left unchanged: '+e.message};
    }
    render();
  };
  reader.readAsText(file);
}

/* ── Markdown parser ── */
function mdToHtml(md){
  // Code is lifted out before anything else runs and put back at the very end.
  // Left inline, a blank line inside a block would split it at the paragraph
  // step, and characters like the * in COUNT(*) would parse as emphasis.
  const blocks=[],inlines=[];
  let h=String(md)
    .replace(/```(\w*)\r?\n([\s\S]*?)```/g,(_,lang,code)=>{
      blocks.push({lang:lang||'',code:code.replace(/\s+$/,'')});
      return '\u0000B'+(blocks.length-1)+'\u0000';
    })
    .replace(/`([^`\n]+)`/g,(_,code)=>{
      inlines.push(code);
      return '\u0000I'+(inlines.length-1)+'\u0000';
    });

  h=h
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // headings
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    // hr
    .replace(/^---+$/gm,'<hr>')
    // blockquote
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    // bold/italic
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    // links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

  // tables
  h=h.replace(/(\|.+\|\n\|[-| :]+\|\n(?:\|.+\|\n?)+)/g,tableBlock=>{
    const rows=tableBlock.trim().split('\n');
    const header=rows[0].split('|').slice(1,-1).map(c=>`<th>${c.trim()}</th>`).join('');
    const body=rows.slice(2).map(r=>{
      const cells=r.split('|').slice(1,-1).map(c=>`<td>${c.trim()}</td>`).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    return `<table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>`;
  });

  // lists
  h=h.replace(/((?:^- .+\n?)+)/gm,block=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^- /,'')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  h=h.replace(/((?:^\d+\. .+\n?)+)/gm,block=>{
    const items=block.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });

  // paragraphs
  h=h.split(/\n{2,}/).map(para=>{
    para=para.trim();
    if(!para)return'';
    if(/^\u0000B\d+\u0000$/.test(para))return para;
    if(/^<(h[1-6]|ul|ol|pre|table|blockquote|hr)/.test(para))return para;
    return`<p>${para.replace(/\n/g,' ')}</p>`;
  }).join('\n');

  // put code back, escaped, now that no other rule can reach it
  h=h.replace(/\u0000I(\d+)\u0000/g,(_,i)=>`<code>${esc(inlines[+i])}</code>`);
  h=h.replace(/\u0000B(\d+)\u0000/g,(_,i)=>{
    const b=blocks[+i];
    return `<pre><code class="lang-${esc(b.lang)}">${esc(b.code)}</code></pre>`;
  });

  return h;
}

/* ── Helpers ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function quizText(s){return esc(s).replace(/`([^`\n]+)`/g,'<code>$1</code>');}

function buildDeFlat(){

function isDvId(id){return /^G\d\d-T\d\d$/.test(id)||DV_EXERCISES.some(x=>x.id===id);}
function isBaId(id){return /^BA\d\d-T\d\d$/.test(id);}
function isDeId(id){return /^DE\d\d-T\d\d$/.test(id);}
function contentUrl(id){
  // hasOwnProperty, not a bare lookup: CONTENT_URLS is an object literal, so
  // contentUrl('constructor') would otherwise return Object.prototype.constructor
  // and hand a function to fetch(). Same inherited-key bug class as TRACK above.
  if(Object.prototype.hasOwnProperty.call(CONTENT_URLS,id))return CONTENT_URLS[id];
  const g=id.match(/^(G\d\d)-T\d\d$/);
  if(g){const grp=DV_GROUPS.find(x=>x.code===g[1]);if(grp)return DV_BASE+grp.folder+'/'+id+'.md';}
  const ex=DV_EXERCISES.find(x=>x.id===id);
  if(ex)return DV_BASE+ex.file;
  if(isBaId(id))return BA_BASE+id+'.md';
  const de=id.match(/^(DE\d\d)-T\d\d$/);
  if(de){const ch=DE_CHAPTERS.find(x=>x.code===de[1]);if(ch)return DE_BASE+id+'.md';}
  return null;
}

function shuffled(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function confetti(count){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const colors=['#58CC02','#1CB0F6','#FF9600','#CE82FF','#FFC800'];
  for(let i=0;i<(count||70);i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    const dur=2.4+Math.random()*1.6;
    p.style.animationDuration=dur+'s';
    p.style.animationDelay=(Math.random()*.4)+'s';
    if(Math.random()>.5)p.style.borderRadius='50%';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),(dur+1.4)*1000);
  }
}

    S.teacherMcq=await res.json();
    S.teacherMcqLoading=false;render();
  }catch(e){
    // Not fatal — sendTeacherMessage()/renderTeacherPanel() both fall back to
    // live chat mode when S.teacherMcq is unavailable, same as a lesson with
    // no authored MCQ set. A failed fetch here just means every lesson opens
    // straight into chat instead of the free MCQ warm-up.
    S.teacherMcqLoading=false;S.teacherMcqError=true;render();
  }
}

/* ── Unit accordion state ──
   isUnitOpen: an explicit user toggle always wins; absent one, a unit opens
   only if isCurrent says so — true for the unit holding the first incomplete
   lesson in Credit Risk/DV/BA, always false for Quiz Practice (its banks are
   peers, so nothing auto-opens there — see renderUnitAccordion). */
function unitKey(trackId,ui){return trackId+':'+ui;}
function isUnitOpen(trackId,ui,isCurrent){
  const k=unitKey(trackId,ui);
  return k in S.expandedOverride?S.expandedOverride[k]:isCurrent;
}
function toggleUnit(trackId,ui,isCurrent){
  S.expandedOverride[unitKey(trackId,ui)]=!isUnitOpen(trackId,ui,isCurrent);
  render();
}
/* One accordion row per unit (Part/Group/Chapter/Bank). Collapsed rows are a
   thin bar; expanded rows additionally render that unit's own path via the
   existing renderPath(), reused unchanged — only the flat list passed to it
   is unit-scoped, remapped to ui:0 (renderPath groups nodes by matching n.ui
   to the loop index within the `units` array it's given, not the caller's
   unit index — mixing those up silently renders zero nodes).
   autoExpand=false (Quiz Practice): no unit is ever "current", so nothing
   auto-opens — every bank is a peer, pickable in any order.
   autoExpand=true (Credit Risk/DV/BA): the unit holding the first
   not-yet-complete lesson opens by default, so you land on your place
   instead of a wall of collapsed bars — unless you've explicitly toggled it,
   which isUnitOpen always honours over the default. */
function renderUnitAccordion(trackId,unitNoun,units,flat,completed,fi,autoExpand){
  const currentUi=autoExpand&&fi<flat.length?flat[fi].ui:-1;
  return `<div class="unit-list">${units.map((u,ui)=>{
    const col=PALETTE[ui%PALETTE.length];
    const uFlat=flat.filter(n=>n.ui===ui);
    const uDone=uFlat.filter(n=>completed[n.id]).length;
    const qCount=uFlat.reduce((a,n)=>a+(n.data.count||0),0);
    const isCurrent=ui===currentUi;
    const open=isUnitOpen(trackId,ui,isCurrent);
    const metaStr=qCount?`${uDone}/${uFlat.length} · ${qCount} q`:`${uDone}/${uFlat.length}`;
    const bar=`<button class="unit-bar" onclick="toggleUnit('${trackId}',${ui},${isCurrent})" style="background:${col.base};">
      <span class="unit-bar-num">${esc(unitNoun)} ${ui+1}</span>
      <span class="unit-bar-name">${esc(u.name)}</span>
      <span class="unit-bar-meta">${metaStr}</span>
      <span class="unit-bar-caret">▸</span>
    </button>`;
    if(!open)return `<div class="unit-row">${bar}</div>`;
    const uFlatLocal=uFlat.map(n=>({...n,ui:0}));
    let ufi=uFlatLocal.findIndex(n=>!completed[n.id]);
    if(ufi===-1)ufi=uFlatLocal.length;
    const localUnits=[{kicker:u.kicker,name:u.name}];
    return `<div class="unit-row expanded">${bar}<div class="unit-body">${renderPath(localUnits,uFlatLocal,completed,ufi)}</div></div>`;
  }).join('')}</div>`;
}

function defaultPlanTrack(){
  return TRACKS.find(t=>t.projPrefix)?.id||TRACKS[0].id;
}
function planTrackId(id){
  return TRACK[id]?id:defaultPlanTrack();

function makeLessonLookup(){
  const lookup=new Map();
  buildFlat().forEach(n=>lookup.set(n.id,n));
  buildDvFlat().forEach(n=>lookup.set(n.id,n));
  if(S.baIndex)buildBaFlat().forEach(n=>lookup.set(n.id,n));
  if(S.quizBank)buildQuizFlat().forEach(n=>lookup.set(n.id,n));
  return lookup;
}
function planLessonFromLookup(lookup,id){
  const n=lookup.get(id);
  // Quiz lessons open a quiz session, not a markdown lesson page.
  const q=/^quiz:(\d+):(\d+)$/.exec(id);
  return {
    id,
    code:n?n.data.code:id,
    title:n?n.data.title:id,
    href:q?`#quiz/${q[1]}/${q[2]}`:`#lesson/${id}`,
    done:!!S.completed[id]
  };
}
function buildPlanBlocks(trackId){
  const meta=TRACK[trackId];
  if(!meta)return null;
  const lookup=makeLessonLookup();
  if(meta.projPrefix){
    if(!S.projIndex)return null;
    const blocks=S.projIndex.filter(p=>p.track===trackId).sort((a,b)=>a.n-b.n).map(p=>{
      const lessons=p.covers.map(id=>planLessonFromLookup(lookup,id));
      const doneCount=lessons.filter(l=>l.done).length;
      const nextLesson=lessons.find(l=>!l.done)||lessons[0]||null;
      return {
        id:p.id,
        title:p.title,
        subtitle:p.tagline,
        lessons,
        doneCount,
        total:lessons.length,
        nextLesson,
        kind:'checkpoint'
      };
    });
    const total=blocks.reduce((a,b)=>a+b.total,0);
    const done=blocks.reduce((a,b)=>a+b.doneCount,0);
    const current=blocks.find(b=>b.doneCount<b.total)||blocks[blocks.length-1]||null;
    return {meta,kind:'checkpoint',kindLabel:'Checkpoint block',blocks,total,done,current};
  }
  if(meta.chapterIndex){
    const chapters=meta.chapterIndex();
    if(!chapters)return null;
    const blocks=chapters.map((ch,ui)=>{
      const lessons=ch.lessons.map(l=>planLessonFromLookup(lookup,l.id));
      const doneCount=lessons.filter(l=>l.done).length;
      const nextLesson=lessons.find(l=>!l.done)||lessons[0]||null;
      return {
        id:ch.code,
        title:ch.name,
        subtitle:ch.desc||`Chapter ${ui+1}`,
        lessons,
        doneCount,
        total:lessons.length,
        nextLesson,
        kind:'chapter'
      };
    });
    const total=blocks.reduce((a,b)=>a+b.total,0);
    const done=blocks.reduce((a,b)=>a+b.doneCount,0);
    const current=blocks.find(b=>b.doneCount<b.total)||blocks[blocks.length-1]||null;
    return {meta,kind:'chapter',kindLabel:'BABOK chapter',blocks,total,done,current};
  }
  return null;
}

function renderStudyPlan(route){
  const trackId=planTrackId(route.ptrack);

  const blocks=buildPlanBlocks(trackId);

  <div class="topbar">
    <a class="topbar-logo" href="#" style="text-decoration:none;color:inherit;" title="Back to the learning path">
      <div class="logo-icon">A</div>
      <span class="logo-name">Analyst Academy</span>
      <span style="font-size:12px;font-weight:800;color:var(--text-lo);text-transform:uppercase;letter-spacing:.6px;">Study Plan</span>
    </a>
    <div class="topbar-stats">
      <div class="stat"><div class="stat-pip" style="background:#FF9600;box-shadow:0 2px 0 #E68200;"></div><span class="stat-val">${S.streak}</span><span class="stat-lbl">day streak</span></div>
      <div class="stat"><div class="stat-gem" style="background:#1CB0F6;box-shadow:0 2px 0 #1899D6;"></div><span class="stat-val">${Object.keys(S.completed).length}</span><span class="stat-lbl">items done</span></div>

    if(S.baError)retries.push('<button class="proj-complete-btn" onclick="retryBaIndex()">Retry BA index</button>');
    if(S.quizError)retries.push('<button class="proj-complete-btn" onclick="retryQuizBank()">Retry quiz bank</button>');
    return topBar+`<div class="plan-page"><div class="plan-empty">Study plan unavailable. Check your connection.<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">${retries.join('')}</div></div></div>`;
  }
  const planPending=el=>`<div class="plan-card"><div class="loading"><div class="spinner"></div>Loading ${el}…</div></div>`;
  const planFailed=(el,fn)=>`<div class="plan-card"><div class="plan-kicker">Unavailable</div><div class="plan-card-sub">${el} could not load.</div><div style="margin-top:12px;"><button class="proj-complete-btn" onclick="${fn}()">Try again</button></div></div>`;
  const blockCard=blocks

        : `<div class="plan-card primary" style="--plan-accent:${meta.col};--plan-shadow:${meta.dark};"><div class="plan-kicker">Primary track</div><h2>${esc(meta.name)}</h2><div class="plan-card-sub">This track does not have a derived study-plan source yet.</div></div>`;
  const total=blocks?blocks.total:0;
  const done=blocks?blocks.done:0;
  const pct=total?Math.round(done/total*100):0;
  const overview=blocks?`
    <div class="plan-overview">
      <div class="plan-overview-head"><span class="plan-overview-lbl">${esc(meta.name)} progress</span><span class="plan-overview-cnt">${done} / ${total}</span></div>
      <div class="plan-overview-track"><div class="plan-overview-fill" style="width:${pct}%;background:${meta.col};"></div></div>

  // The whole arc at a glance: one dot per block, filled for done, ringed for the
  // one in progress. Seeing block 13 exist is the point — the Credit Risk course
  // is one borrower's story and the last block only lands if you did the first.
  let arc='',blockList='';
  if(blocks&&blocks.blocks.length){
    const cur=blocks.current;
    arc=`

          // shape. All four accents fall under 3.0:1 on the light surface —
          // credit 2.09, dv 2.44, ba 2.54, quiz 2.18 — so a coloured rim is
          // effectively invisible in light mode. --text-hi carries the outline
          // (16.1 light / 14.3 dark) and the accent stays as the halo, which
          // keeps the track identity without being load-bearing.
          const ring=here?`box-shadow:0 0 0 3px ${hexRgba(meta.col,.45)};border-color:var(--text-hi);`:'';

          // same page, so as links they were a row of identical empty tab stops.

          return `<span class="plan-dot" title="${esc(String(i+1)+'. '+b.title+' — '+(done?'done':(here?'in progress':'not started')))}" style="background:${bg};${ring}"></span>`;

        // symbol with two different meanings. A filled ring also matches how the
        // arc above marks the current block.
        const mark=isDone?'✓':(here?'◉':'○');
        const ids=b.lessons.map(l=>l.id);
        const span=ids.length>2?ids[0]+'–'+ids[ids.length-1]:ids.join(' ');
        // Every block is reachable, not just the current one. Finished work must
        // stay openable — you revise by going back to it, and a plan that only
        // ever points forward cannot show you what you already did.
        const href=open?`#plan/${encodeURIComponent(trackId)}`
                       :`#plan/${encodeURIComponent(trackId)}/${encodeURIComponent(b.id)}`;
        const head=`<a class="plan-row${here?' here':''}${open?' open':''}" href="${href}"
             style="${here?`border-color:${meta.col};`:''}"

          <span class="plan-row-n">${i+1}</span>

          <span class="plan-row-ids">${esc(span)}</span>
          <span class="plan-row-cnt">${isDone?'done':b.doneCount+'/'+b.total}</span>
          <span class="plan-row-caret">${open?'▾':'▸'}</span>

        if(!open)return head;
        return head+`<div class="plan-row-open" id="planblk-${esc(b.id)}">
          ${b.lessons.map(l=>`<a class="plan-open-lesson${l.done?' done':''}" href="${l.href}">
             <span class="plan-open-mark" style="color:${l.done?meta.col:'var(--text-lo)'}">${l.done?'✓':'○'}</span>
             <span class="plan-open-code">${esc(l.code||l.id)}</span>
             <span class="plan-open-title">${esc(l.title)}</span>
             <span class="plan-open-go">${l.done?'Revisit':'Open'} →</span>
           </a>`).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }
  return topBar+`
  <div class="plan-page">
    <div class="plan-hero">
      <div class="plan-title">Study Plan</div>
      <div class="plan-sub">Where you are, what to do next, and everything still ahead. Pick a track.</div>
      ${selector}
      ${arc}
    </div>
    <div class="plan-primary">
      ${blockCard}
    </div>
    ${blockList}
  </div>`;
}

/* ── Routing ── */
function getHashRoute(){
  const h=window.location.hash.slice(1);
  // The front page is the track path — the road. The Study Plan is its own page
  // at #plan. Making the plan the landing page hid the path, which is the thing
  // that shows the whole journey and is why the app is motivating at all.
  if(!h||h==='/') return {view:'main',track:DEFAULT_TRACK};
  // #plan/<track>/<blockId> opens that block inline. The open block lives in the
  // hash rather than in S, so it survives a re-render (marking a lesson complete
  // rebuilds the page) and is bookmarkable — same reason the track is in the hash.
  // Empty segments and a trailing slash are tolerated: #plan, #plan/, #plan//,
  // #plan/credit and #plan/credit/ all land on the plan rather than falling
  // through to the road. Segments are decoded because they are built with
  // encodeURIComponent, so an id needing escaping survives the round trip.
  const pl=h.match(/^plan(?:\/([^/]*))?(?:\/([^/]*))?\/?$/);
  if(pl){
    const dec=v=>{try{return v?decodeURIComponent(v):'';}catch(e){return '';}};
    return {view:'plan',ptrack:planTrackId(dec(pl[1])||defaultPlanTrack()),pblock:dec(pl[2])||null};
  }
  if(h==='backup') return {view:'backup'};
  // Any registered track id routes itself; unknown ids fall through to the default.
  const t=h.match(/^track\/(.+)$/);
  if(t&&TRACK[t[1]]) return {view:'main',track:t[1]};
  const q=h.match(/^quiz\/(\d+)\/(\d+)$/);
  if(q) return {view:'quiz',qi:+q[1],li:+q[2]};
  // A single bank's own path — the landing page links here instead of flattening
  // every bank into one continuous trail. See the .quiz-cat-grid comment.
  const qb=h.match(/^quizbank\/(\d+)$/);
  if(qb) return {view:'quizbank',qi:+qb[1]};
  // Only tracks that registered a projPrefix have a checkpoint timeline.
  const pt=h.match(/^projects\/(.+)$/);
  if(pt&&TRACK[pt[1]]&&TRACK[pt[1]].hasProjects) return {view:'projtl',ptrack:pt[1]};
  const pr=h.match(/^project\/(P-[A-Z]+-\d+)$/);
  if(pr) return {view:'project',id:pr[1]};
  const m=h.match(/^lesson\/(.+)$/);
  if(m) return {view:'lesson',id:m[1]};
  return {view:'main',track:DEFAULT_TRACK};
}

/* ── The Teacher ──
   A Socratic AI tutor scoped to one lesson at a time, backed by api/tutor.js.
   Works across every track with lesson pages (Credit Risk, DV, BA) — Quiz
   Practice has no lesson pages, so it never reaches this. Opening a
   different lesson's Teacher panel resets the
   conversation — this is meant to be a focused memorization session on the
   material in front of the student, not a general-purpose chatbot. */
function htmlToPlainText(html){
  const div=document.createElement('div');
  div.innerHTML=html;
  return (div.textContent||'').replace(/\n{3,}/g,'\n\n').trim();
}
function openTeacher(lessonId){
  if(S.teacherLessonId!==lessonId){
    S.teacherMessages=[];S.teacherError=null;S.teacherDraft='';
    // Every fresh lesson opens into the free MCQ warm-up, not straight into a
    // billed API call — see sendTeacherMessage() and renderTeacherPanel() for
    // the two ways out of MCQ mode (finishing the set, or typing instead of
    // clicking an answer).
    S.teacherMode='mcq';S.teacherMcqIndex=0;S.teacherMcqSelected=null;S.teacherMcqDone=false;
  }
  S.teacherOpen=true;S.teacherLessonId=lessonId;
  if(!S.teacherMcq&&!S.teacherMcqLoading)loadTeacherMcq();
  render();
  // No scrollIntoView needed here (LESSONS-LEARNED entry 29 covered a
  // scrollIntoView({behavior:'smooth'}) no-op when the panel was in normal
  // page flow after a long lesson body). The panel is now position:fixed —
  // it renders anchored to the viewport regardless of scroll position or
  // where it sits in the DOM, so there is nothing to scroll to.
}
function closeTeacher(){S.teacherOpen=false;render();}
// Closing and reopening on the SAME lesson does not clear teacherMessages —
// openTeacher() only resets on a lessonId change (see above). Without this,
// hitting the server's history-too-long cap (MAX_HISTORY_MESSAGES in
// api/tutor.js) was a genuine dead end: the error told the student to "start
// a new session" but nothing in the UI could actually do that short of
// navigating to a different lesson and back. LESSONS-LEARNED entry 32.
function resetTeacherSession(){
  // Guarded here too, not just via the button's disabled attribute — a
  // request in flight when this fires would otherwise still land after the
  // reset and mutate the "fresh" state sendTeacherMessage() no longer knows
  // was reset out from under it (push a reply into an emptied conversation,
  // or restore a stale draft). Codex caught this race during review.
  if(S.teacherLoading)return;
  S.teacherMessages=[];S.teacherError=null;S.teacherDraft='';render();
}
function teacherMcqEntry(lessonId){
  return S.teacherMcq&&S.teacherMcq.lessons&&S.teacherMcq.lessons[lessonId];
}
function teacherMcqSelect(i){
  if(S.teacherMcqSelected!==null)return;   // already answered this one — ignore further clicks
  S.teacherMcqSelected=i;
  render();
}
function teacherMcqNext(){
  const entry=teacherMcqEntry(S.teacherLessonId);
  if(!entry||S.teacherMcqSelected===null)return;
  if(S.teacherMcqIndex+1>=entry.questions.length){
    S.teacherMcqDone=true;render();return;
  }
  S.teacherMcqIndex++;S.teacherMcqSelected=null;render();
}
// The one deliberate way out of the free MCQ warm-up into the billed live
// chat — see also sendTeacherMessage(), which does the same switch if the
// student types a message instead of picking an answer at any point.
function teacherContinueChat(){S.teacherMode='chat';render();}
function teacherToggleWide(){S.teacherWide=!S.teacherWide;render();}
async function sendTeacherMessage(){
  const ta=document.getElementById('teacher-input');
  if(!ta)return;
  const message=ta.value.trim();
  if(!message||S.teacherLoading)return;
  // Typing a real message — instead of clicking an MCQ choice — is the
  // explicit signal to leave the free warm-up and start a real, billed
  // conversation with the live API. See teacherContinueChat() for the other
  // way out (finishing the MCQ set).
  if(S.teacherMode==='mcq')S.teacherMode='chat';
  const lessonId=S.teacherLessonId;
  // mdCache holds the already-converted HTML (see loadLesson), not the raw
  // markdown — strip tags client-side rather than re-fetching, so the model
  // gets clean prose instead of HTML noise.
  const lessonMarkdown=htmlToPlainText(mdCache[lessonId]||'');
  const flat=isDvId(lessonId)?buildDvFlat():(isBaId(lessonId)?buildBaFlat():buildFlat());
  const entry=flat.find(n=>n.id===lessonId);
  const lessonTitle=entry?entry.data.title:'';
  S.teacherMessages.push({role:'user',content:message});
  S.teacherLoading=true;S.teacherError=null;S.teacherDraft='';
  ta.value='';
  render();
  try{
    const res=await fetch('/api/tutor',{
      method:'POST',
      headers:{'content-type':'application/json','x-app-tag':'analyst-academy-teacher-v1'},
      body:JSON.stringify({
        lessonTitle,lessonMarkdown,
        history:S.teacherMessages.slice(0,-1),
        message
      })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.reply){
      S.teacherError=data.error||'The Teacher is unavailable right now.';
      S.teacherMessages.pop();
      S.teacherDraft=message; // don't make a network hiccup cost the student their typed answer
    }else{
      S.teacherMessages.push({role:'assistant',content:data.reply});
    }
  }catch(e){
    S.teacherError='Could not reach the Teacher — check your connection.';
    S.teacherMessages.pop();
    S.teacherDraft=message;
  }
  S.teacherLoading=false;
  render();
  const box=document.getElementById('teacher-scroll');
  if(box)box.scrollTop=box.scrollHeight;
}
function teacherKeydown(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();sendTeacherMessage();}
}
function renderTeacherPanel(lessonId,lessonTitle){

  const messages=isThisLesson?S.teacherMessages:[];
  const loading=isThisLesson&&S.teacherLoading;
  const error=isThisLesson?S.teacherError:null;
  const draft=isThisLesson?S.teacherDraft:'';
  const mcqEntry=isThisLesson?teacherMcqEntry(lessonId):null;
  // Three body states: the free MCQ set (mcqEntry exists and mode is still
  // 'mcq'), a brief loading state while the MCQ file is still in flight, or
  // chat — which is also the fallback the moment the fetch finishes and this
  // particular lesson turns out to have no authored MCQ set yet (most
  // lessons, for now — see HANDOFF "Next phase").
  const mcqStillLoading=S.teacherMcqLoading&&!S.teacherMcq;
  const showMcq=isThisLesson&&S.teacherMode==='mcq'&&!!mcqEntry;
  const showMcqLoading=isThisLesson&&S.teacherMode==='mcq'&&!mcqEntry&&mcqStillLoading;

  let mcqBody='';
  if(showMcq){

    if(S.teacherMcqDone){
      mcqBody=`
        <div class="teacher-msg assistant"><div class="teacher-bubble">${quizText(mcqEntry.close)}</div></div>

    }else{

        <div class="teacher-head-sub" style="margin:10px 0 2px;">Question ${S.teacherMcqIndex+1} of ${mcqEntry.questions.length}</div>
        <div class="quiz-q" style="font-size:15px;margin:4px 0 14px;">${quizText(q.q)}</div>
        <div class="quiz-choices">
          ${q.choices.map((c,i)=>{
            let cls='quiz-choice';
            if(answered){
              if(i===q.correct)cls+=' correct';
              else if(i===S.teacherMcqSelected)cls+=' wrong';
            }
            return `<button class="${cls}" ${answered?'disabled':''} onclick="teacherMcqSelect(${i})">${quizText(c)}</button>`;
          }).join('')}
        </div>
        ${answered?`
          <div class="quiz-fb ${S.teacherMcqSelected===q.correct?'good':'bad'}">
            <div class="quiz-fb-explain">${quizText(S.teacherMcqSelected===q.correct?q.right:q.wrong)}</div>
          </div>
          <button class="quiz-btn next" style="margin-top:12px;" onclick="teacherMcqNext()">${S.teacherMcqIndex+1>=mcqEntry.questions.length?'See how you did':'Next question'}</button>
        `:''}`;

  }
  return `
  <div class="teacher-panel${S.teacherWide?' wide':''}">
    <div class="teacher-head">
      <div>

        <div class="teacher-head-sub">${showMcq?'Warm-up quiz':'Memorization tutor'} · ${esc(lessonTitle)}</div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button class="teacher-close teacher-wide-toggle" title="${S.teacherWide?'Shrink':'Widen — answers run long'}" onclick="teacherToggleWide()">${S.teacherWide?'⤡':'⤢'}</button>
        <button class="teacher-close" title="Start a new session" onclick="resetTeacherSession()" ${loading?'disabled':''}>↻</button>

        ${messages.length===0&&!loading?`<div class="teacher-empty">Ask The Teacher to quiz you on this lesson, or say "start" and let it lead.</div>`:''}
        ${messages.map(m=>`<div class="teacher-msg ${m.role}"><div class="teacher-bubble">${esc(m.content)}</div></div>`).join('')}
        ${loading?`<div class="teacher-msg assistant"><div class="teacher-bubble teacher-thinking">Thinking…</div></div>`:''}
      `:''}

/* ── Quiz session ──
   Question flow adapted from the Studying Assistant quiz module: select → check →
   coloured feedback with explanation → next, with a running streak. */
function startQuizSession(qi,li){
  const lesson=S.quizBank&&S.quizBank.quizzes[qi]&&S.quizBank.quizzes[qi].lessons[li];
  if(!lesson)return;
  const questions=shuffled(lesson.questions).map(q=>
    q.type==='matching_pairs'?q:{...q,choices:shuffled(q.choices)});
  S.session={qi,li,questions,idx:0,score:0,streak:0,best:0,
             answered:false,selected:null,correct:false,mpSel:null,mpPairs:{},done:false};
}
function normAns(s){return String(s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?"'`]/g,'');}
function currentQ(){const s=S.session;return s&&s.questions[s.idx];}

function quizSelect(i){
  const s=S.session,q=currentQ();
  if(!s||s.answered||!q)return;
  s.selected=q.choices[i];
  render();
}
function mpPickTerm(i){
  const s=S.session,q=currentQ();
  if(!s||s.answered||!q)return;
  const term=q.choices.terms[i];
  if(s.mpPairs[term]!==undefined)return;
  s.mpSel=(s.mpSel===term)?null:term;
  render();
}
function mpPickDef(i){
  const s=S.session,q=currentQ();
  if(!s||s.answered||!q||!s.mpSel)return;
  const def=q.choices.definitions[i];
  if(Object.values(s.mpPairs).indexOf(def)!==-1)return;
  s.mpPairs[s.mpSel]=def;
  s.mpSel=null;
  render();
}
function quizAnswerReady(){
  const s=S.session,q=currentQ();
  if(!s||!q)return false;
  if(q.type==='matching_pairs')return Object.keys(s.mpPairs).length>=q.choices.terms.length;
  return s.selected!==null;
}
function quizCheck(){
  const s=S.session,q=currentQ();
  if(!s||s.answered||!q||!quizAnswerReady())return;
  let ok;
  if(q.type==='matching_pairs'){
    ok=Object.keys(q.correct_answer).every(t=>s.mpPairs[t]===q.correct_answer[t]);
  }else{
    ok=normAns(s.selected)===normAns(q.correct_answer);
  }
  s.answered=true;s.correct=ok;
  if(ok){s.score++;s.streak++;s.best=Math.max(s.best,s.streak);}else{s.streak=0;}
  render();
}
function quizNext(){
  const s=S.session;
  if(!s)return;
  if(s.idx+1>=s.questions.length){
    s.done=true;
    const pct=Math.round(s.score/s.questions.length*100);
    const id=quizId(s.qi,s.li);
    saveQuizScore(id,pct);
    if(pct>=60&&!S.completed[id]){S.completed[id]=true;saveCompleted(S.completed);}
    render();
    if(pct>=80)confetti();
    return;
  }
  s.idx++;s.answered=false;s.selected=null;s.correct=false;s.mpSel=null;s.mpPairs={};
  render();
}

function renderQuizSession(route){
  if(S.quizLoading)return `<div class="loading"><div class="spinner"></div>Loading quiz bank…</div>`;
  // Only quizError means failed. A cold deep link to #quiz/0/0 has no bank and no
  // fetch started yet, and must show pending rather than "unavailable" (entry 6).
  if(!S.quizBank)return S.quizError
    ? `<div class="loading" style="color:var(--text-lo)">Quiz bank unavailable.<button onclick="retryQuizBank()" class="quiz-btn" style="margin-top:12px;max-width:200px;">Try again</button></div>`
    : `<div class="loading"><div class="spinner"></div>Loading quiz bank…</div>`;
  const quiz=S.quizBank.quizzes[route.qi];
  const lesson=quiz&&quiz.lessons[route.li];
  if(!lesson)return `<div style="padding:40px;text-align:center;color:var(--text-mid)">Quiz lesson not found</div>`;

  const s=S.session;
  if(!s||s.qi!==route.qi||s.li!==route.li){startQuizSession(route.qi,route.li);}
  const sess=S.session;
  const col=PALETTE[route.qi%PALETTE.length];

  const header=`
  <div style="background:${col.base};color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;">
    <button onclick="S.session=null;window.location.hash='quizbank/${route.qi}'" style="background:rgba(255,255,255,.22);border:none;color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;">← Back to quizzes</button>
    <div style="flex:1;">
      <div style="font-size:12px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px;">${esc(quiz.quiz_name)}</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;margin-top:3px;">${esc(lesson.lesson_name)}</div>
    </div>
  </div>`;

  if(sess.done){
    const total=sess.questions.length;
    const pct=Math.round(sess.score/total*100);
    const msg=pct>=80?'Excellent work!':pct>=60?'Passed — keep practising.':'Below 60% — worth another run.';
    return header+`
    <div class="quiz-wrap">
      <div class="quiz-final">
        <div class="quiz-final-score" style="color:${pct>=60?'#58CC02':'#FF9600'}">${pct}%</div>
        <div class="quiz-final-sub">${sess.score} of ${total} correct · best streak ${sess.best}</div>
        <div class="quiz-final-sub" style="margin-top:14px;color:var(--text-hi);">${esc(msg)}</div>
        <div class="quiz-actions" style="max-width:420px;margin:26px auto 0;">
          <button class="quiz-btn" onclick="startQuizSession(${route.qi},${route.li});render();">Retry</button>
          <button class="quiz-btn next" onclick="S.session=null;window.location.hash='quizbank/${route.qi}'">Done</button>
        </div>
      </div>
    </div>`;
  }

  const q=sess.questions[sess.idx];
  const total=sess.questions.length;
  let answerHtml;

  if(q.type==='matching_pairs'){
    const terms=q.choices.terms,defs=q.choices.definitions;
    const usedDefs=Object.values(sess.mpPairs);
    answerHtml=`
    <div class="mp-grid">
      <div>
        <div class="mp-col-lbl">Terms</div>
        ${terms.map((t,i)=>{
          const paired=sess.mpPairs[t]!==undefined;
          return `<button class="mp-btn${sess.mpSel===t?' active':''}${paired?' paired':''}" ${sess.answered||paired?'disabled':''} onclick="mpPickTerm(${i})">${esc(t)}</button>`;
        }).join('')}
      </div>
      <div>
        <div class="mp-col-lbl">Definitions</div>
        ${defs.map((d,i)=>{
          const used=usedDefs.indexOf(d)!==-1;
          return `<button class="mp-btn${used?' paired':''}" ${sess.answered||used?'disabled':''} onclick="mpPickDef(${i})">${esc(d)}</button>`;
        }).join('')}
      </div>
    </div>
    <div class="mp-pairs">${
      sess.answered
      ? Object.keys(q.correct_answer).map(t=>{
          const given=sess.mpPairs[t];const ok=given===q.correct_answer[t];
          return `<div class="mp-row ${ok?'ok':'no'}"><span class="term">${esc(t)}</span><span>${ok?'✓':'✗'}</span><span>${esc(given||'—')}</span>${ok?'':`<span class="corr">(${esc(q.correct_answer[t])})</span>`}</div>`;
        }).join('')
      : Object.keys(sess.mpPairs).map(t=>
          `<div class="mp-row"><span class="term">${esc(t)}</span><span>→</span><span>${esc(sess.mpPairs[t])}</span></div>`).join('')
    }</div>`;
  }else{
    answerHtml=`<div class="quiz-choices">${q.choices.map((c,i)=>{
      let cls='quiz-choice';
      if(sess.answered){
        if(normAns(c)===normAns(q.correct_answer))cls+=' correct';
        else if(c===sess.selected)cls+=' wrong';
      }else if(sess.selected===c)cls+=' selected';
      return `<button class="${cls}" ${sess.answered?'disabled':''} onclick="quizSelect(${i})">${quizText(c)}</button>`;
    }).join('')}</div>`;
  }

  let fb='';
  if(sess.answered){
    const correctLine=sess.correct?'':`<div>Answer: <strong>${esc(q.type==='matching_pairs'?'see above':q.correct_answer)}</strong></div>`;
    fb=`<div class="quiz-fb ${sess.correct?'good':'bad'}">
      <div class="quiz-fb-verdict">${sess.correct?'Correct 🎉':'Not quite'}</div>
      ${correctLine}
      ${q.explanation?`<div class="quiz-fb-explain">${quizText(q.explanation)}</div>`:''}
    </div>`;
  }

  const btn=sess.answered
    ? `<button class="quiz-btn next" onclick="quizNext()">${sess.idx+1>=total?'See results':'Next →'}</button>`
    : `<button class="quiz-btn" ${quizAnswerReady()?'':'disabled'} onclick="quizCheck()">Check</button>`;

  return header+`
  <div class="quiz-wrap">
    <div class="quiz-meta">
      <span>Question ${sess.idx+1} of ${total}</span>
      <span>✅ ${sess.score}${sess.streak>1?' &nbsp; 🔥 '+sess.streak:''}</span>
    </div>
    <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${sess.idx/total*100}%"></div></div>
    <div class="quiz-q">${quizText(q.question_text)}</div>
    ${answerHtml}
    ${fb}
    <div class="quiz-actions">${btn}</div>
  </div>`;
}

/* ── Track registry ──
   The single source of truth for tracks. Routing, the nav tabs, the checkpoint
   routes and the project-id → track mapping are all DERIVED from this list, so
   adding a track means adding one entry here plus its hero/path body in
   renderApp — not edits in five separate places.
   `projPrefix` is what makes a track own checkpoint projects; omit it (as Quiz
   Practice does) and no checkpoint route is generated for that track. */
/* planErr / planRetry: which fetch backs this track's plan blocks, and how to
   retry it. Declared here because the plan page previously inferred it — it
   assumed any chapterIndex track was backed by baIndex, which is true for BA and
   false for Quiz Practice. A failed quiz-bank fetch then matched no error branch
   and the page span forever with no retry. Never infer which loader owns a
   track; make the track say so. */
const TRACKS=[
  {id:'credit',name:'Credit Risk',    tab:'💼 Credit Risk',    col:'#58CC02',dark:'#46A302',projPrefix:'P-CR-',
   planErr:()=>S.projError, planRetry:'retryProjIndex'},
  {id:'dv',    name:'Data Validation',tab:'🧪 Data Validation',col:'#1CB0F6',dark:'#1899D6',projPrefix:'P-DV-',
   planErr:()=>S.projError, planRetry:'retryProjIndex'},
  // Phase 1 only (6 of the approved 36 lessons; see
  // docs/data-engineering-curriculum-proposal.md). Structured like DV: a
  // compiled-in chapter list (DE_CHAPTERS) plus checkpoints (projPrefix),
  // not BA's runtime-fetched-index pattern — see DE_CHAPTERS' own comment
  // for why.
  {id:'de',    name:'Data Engineering',tab:'⚙️ Data Engineering',col:'#00C2A8',dark:'#00A38C',projPrefix:'P-DE-',
   planErr:()=>S.projError, planRetry:'retryProjIndex'},
  // chapterIndex: how the Study Plan blocks a track that owns no checkpoints.
  // Declared here rather than tested by id in the plan code, so a future
  // checkpoint-less track works by adding a registry entry, not by editing plan
  // logic. A track needs exactly one of projPrefix or chapterIndex to appear.
  {id:'ba',    name:'Business Analysis',tab:'📐 Business Analysis',col:'#CE82FF',dark:'#A568CC',chapterIndex:()=>S.baIndex,
   planErr:()=>S.baError, planRetry:'retryBaIndex'},
  // Quiz Practice owns no checkpoints, but its 11 banks are natural blocks —
  // same chapterIndex mechanism the BA track uses, so the plan page needs no
  // special case for it.
  {id:'quiz',  name:'Quiz Practice',  tab:'🎯 Quiz Practice',  col:'#FF9600',dark:'#E68200',
   chapterIndex:()=>S.quizBank&&S.quizBank.quizzes.map((z,qi)=>({
     code:'Q'+(qi+1),
     name:z.quiz_name,
     desc:z.lessons.length+' lessons · '+z.lessons.reduce((a,l)=>a+l.questions.length,0)+' questions',
     lessons:z.lessons.map((l,li)=>({id:quizId(qi,li),title:l.lesson_name}))
   })),
   planErr:()=>S.quizError, planRetry:'retryQuizBank'}
];
/* Object.create(null), not {} — a plain object inherits from Object.prototype,
   so TRACK['constructor'] and TRACK['toString'] would be truthy and a hash like
   #track/constructor would validate as a real track. A null-prototype map has no
   inherited keys, so lookups are exactly the registry and nothing else. */
const TRACK=Object.create(null);
TRACKS.forEach(t=>{t.home='track/'+t.id;t.hasProjects=!!t.projPrefix;TRACK[t.id]=t;});
const DEFAULT_TRACK='credit';
/* Which track owns a checkpoint id, by its registered prefix. */
function trackForProject(id){
  const t=TRACKS.find(t=>t.projPrefix&&String(id).indexOf(t.projPrefix)===0);
  return t?t.id:DEFAULT_TRACK;
}
/* Hex → rgba so a track's accent can tint backgrounds without extra CSS. */
function hexRgba(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ── Checkpoint pages (full pages, no dialogs) ── */
function coversLabel(p){
  if(p.groups)return p.groups.join(' + ');
  return p.covers[0]+(p.covers.length>1?'–'+p.covers[p.covers.length-1]:'');
}
function renderProjTimeline(route){

  <div style="background:${meta.col};color:#fff;padding:20px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;">

    <div style="flex:1;">
      <div style="font-size:12px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px;">Checkpoint projects</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;margin-top:3px;">${esc(meta.name)} · milestone timeline</div>
    </div>
  </div>`;
  if(S.projLoading)return header+`<div class="loading"><div class="spinner"></div>Loading checkpoints…</div>`;

  if(!S.projIndex)return header+(S.projError
    ? `<div class="loading" style="color:var(--text-lo)">Checkpoints unavailable.<button class="proj-complete-btn" onclick="retryProjIndex()">Try again</button></div>`
    : `<div class="loading"><div class="spinner"></div>Loading checkpoints…</div>`);
  const list=S.projIndex.filter(p=>p.track===route.ptrack);
  const done=list.filter(p=>S.completed[p.id]).length;
  const items=list.map(p=>{
    const st=projState(p);
    const dot=st==='done'?'✓':st==='open'?'▶':'🔒';
    return `<a class="tl-item ${st}" href="#project/${esc(p.id)}">
      <div class="tl-dot ${st}">${dot}</div>
      <div class="tl-title">${p.n}. ${esc(p.title)}</div>
      <div class="tl-sub">${esc(coversLabel(p))}${st==='done'?' · done':st==='open'?' · ready':''}</div>
    </a>`;
  }).join('');
  return header+`
  <div class="tl-page">
    <div class="progress-card" style="max-width:520px;margin:0 auto;">

      <div class="progress-track"><div class="progress-fill" style="width:${list.length?Math.round(done/list.length*100):0}%;background:${meta.col};"></div></div>
    </div>
    <div class="tl-strip-wrap"><div class="tl-strip">${items}</div></div>
    <div class="tl-hint">Scroll → each checkpoint unlocks when every lesson it consolidates is complete. Finish the project work, then mark it done to bank the milestone (+50 XP).</div>
  </div>`;
}
function renderProjectPage(route){
  const p=(S.projIndex||[]).find(x=>x.id===route.id);
  // On an unknown id, infer the track from the id itself rather than defaulting to
  // credit — otherwise a bad DV link sends you back to the wrong track's timeline.
  const guessed=trackForProject(route.id);
  const track=p?p.track:guessed;
  const meta=TRACK[track];
  const header=`
  <div style="background:${meta.col};color:#fff;padding:20px 28px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20;">
    <a href="#projects/${track}" style="background:rgba(255,255,255,.22);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:20px;text-decoration:none;">← Timeline</a>
    <div style="flex:1;">
      <div style="font-size:12px;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.6px;">${esc(meta.name)} · Checkpoint ${p?p.n:''}</div>
      <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;margin-top:3px;">${p?esc(p.title):'Checkpoint'}</div>
    </div>
  </div>`;
  // Three states, and the third one used to be unreachable. Precedence made this
  // `projLoading || (!projIndex && !projError)`, so once the index fetch FAILED
  // it fell through to "Checkpoint not found" — no error, no retry — and
  // render()'s trigger will not re-fetch while projError is set, leaving the page
  // permanently wrong about a checkpoint that exists. Entry 6's sweep missed it
  // because the false negative is worded "not found", not "unavailable".
  if(S.projLoading||(!S.projIndex&&!S.projError))return header+`<div class="loading"><div class="spinner"></div>Loading…</div>`;
  if(!S.projIndex)return header+`<div class="loading" style="color:var(--text-lo)">Checkpoints unavailable — check your connection.<button class="proj-complete-btn" onclick="retryProjIndex()">Try again</button></div>`;
  // Index loaded successfully and this id genuinely is not in it.
  if(!p)return header+`<div style="padding:40px;text-align:center;color:var(--text-mid)">Checkpoint not found</div>`;
  const st=projState(p);
  const missing=p.covers.filter(id=>!S.completed[id]);
  let statusBox;
  if(st==='done'){
    statusBox=`<div class="proj-status done">✓ Milestone banked (+50 XP). Nice work.
      <div><button class="proj-complete-btn undo" onclick="toggleProject('${esc(p.id)}')">Mark as not done</button></div></div>`;
  }else if(st==='open'){
    statusBox=`<div class="proj-status open">▶ All ${p.covers.length} covered lessons complete — this checkpoint is ready.
      <div><button class="proj-complete-btn" onclick="toggleProject('${esc(p.id)}')">Mark checkpoint done · +50 XP</button></div></div>`;
  }else{
    statusBox=`<div class="proj-status locked">🔒 Unlocks when the covered lessons are done — ${missing.length} of ${p.covers.length} remaining
      (next up: ${missing.slice(0,4).map(esc).join(', ')}${missing.length>4?'…':''}). You can read the brief now and plan ahead.</div>`;
  }
  let body;
  if(S.projMdLoading[p.id]){body=`<div class="loading"><div class="spinner"></div>Loading brief…</div>`;}
  else if(S.projMd[p.id]){body=`<div class="md">${S.projMd[p.id]}</div>`;}
  else{body=`<div class="loading" style="color:var(--text-lo)">Brief unavailable.<button class="proj-complete-btn" onclick="retryProjMd('${esc(p.id)}')">Try again</button></div>`;}
  return header+`
  <div style="max-width:900px;margin:0 auto;padding:26px 28px 60px;">
    ${statusBox}
    <div style="margin-top:26px;">${body}</div>
  </div>`;
}

/* ── Render ── */
function nodeShort(n,status){
  if(status==='complete')return '✓';
  if(n.type==='case')return 'CS';
  if(n.type==='exercise')return 'E';
  if(n.type==='technique')return n.data.code.replace('T','');
  if(n.type==='quizlesson')return n.data.code;
  return n.data.code.replace('M','');
}
function renderPath(units,flat,completed,fi){
  return `<div class="path">${units.map((u,ui)=>{
    const col=PALETTE[ui%PALETTE.length];
    const uFlat=flat.filter(n=>n.ui===ui);
    const uDone=uFlat.filter(n=>completed[n.id]).length;
    const nodes=uFlat.map(n=>{
      const gi=flat.indexOf(n);
      const status=gi<fi?'complete':gi===fi?'current':'available';
      const off=OFFSETS[gi%OFFSETS.length];
      const isDiamond=n.type==='case'||n.type==='exercise';const size=isDiamond?66:74;
      const bg=col.base,sh=col.dark,txtCol='#fff';
      const capCol=status==='current'?'var(--text-hi)':'var(--text-mid)';
      const short=nodeShort(n,status);
      let btnStyle=`width:${size}px;height:${size}px;background:${bg};box-shadow:0 6px 0 ${sh};`;
      btnStyle+=isDiamond?'border-radius:16px;transform:rotate(45deg);':'border-radius:50%;';
      // The next node to do gets expanding rings in the track's own colour.
      const isNext=status==='current';
      if(isNext)btnStyle+=`--ripple:${bg};`;
      const lblStyle=isDiamond
        ?`transform:rotate(-45deg);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12px;color:${txtCol};display:block;`
        :`font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:${txtCol};display:block;`;
      const href=n.type==='quizlesson'?`#quiz/${n.qi}/${n.li}`:`#lesson/${esc(n.id)}`;
      const score=S.quizScores[n.id];
      const sub=n.type==='quizlesson'
        ?`<div style="font-size:10.5px;font-weight:700;color:var(--text-lo);">${n.data.count} q${score!==undefined?` · best ${score}%`:''}</div>`
        :'';
      return`<div class="node-wrap" style="transform:translateX(${off}px);">
        <a href="${href}" class="node-btn${isNext?' is-next':''}" style="${btnStyle};text-decoration:none;">
          <span style="${lblStyle}">${esc(short)}</span>
        </a>
        <div class="node-caption" style="color:${capCol};font-weight:${isNext?800:700};">${esc(n.data.title)}</div>
        ${isNext?`<div class="next-badge" style="background:${bg};">Next</div>`:''}
        ${sub}
      </div>`;
    }).join('');
    return`<div class="unit">
      <div class="unit-banner" style="background:${col.base};box-shadow:0 5px 0 ${col.dark};">
        <div class="unit-kicker">${esc(u.kicker)}</div>
        <div class="unit-name">${esc(u.name)}</div>
        <div class="unit-done">${uDone} / ${uFlat.length} complete</div>
      </div>
      <div class="nodes">${nodes}</div>
    </div>`;
  }).join('')}</div>`;
}

  dvFlat.forEach(n=>{if(completed[n.id])xp+=n.type==='exercise'?15:5;});
  deFlat.forEach(n=>{if(completed[n.id])xp+=DE_XP;});
  Object.keys(completed).forEach(k=>{if(k.indexOf('quiz:')===0)xp+=QUIZ_XP;});
  Object.keys(completed).forEach(k=>{if(k.indexOf('P-')===0)xp+=PROJECT_XP;});
  // Counted from the ids, not from baFlat, so XP does not dip to zero while the
  // BA chapter index is still being fetched.
  Object.keys(completed).forEach(k=>{if(isBaId(k))xp+=BA_XP;});

  if(route.view==='plan')return renderStudyPlan(route);
  if(route.view==='backup')return renderBackupPage();
  if(route.view==='quiz')return renderQuizSession(route);

  // uses it) — it lands on the normal accordion landing page with that one
  // bank pre-expanded, rather than a separate page. S.quizBank may not be
  // loaded yet on a cold link; the expand just no-ops harmlessly until it is,
  // since the accordion body only renders once S.quizBank exists.

    S.expandedOverride[unitKey('quiz',route.qi)]=true;
    route.view='main';route.track='quiz';

    // re-enters render() recursively. Without advancing the URL off

      </div>
      <div class="framework">
        <div class="framework-lbl">Every module covers all 15</div>
        <div class="chips">${FRAMEWORK_CHIPS.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>
      </div>
      <a class="proj-hero-btn" href="#projects/credit">🏁 Checkpoint projects${projSummary('credit')}</a>
    </div>`;
    const units=UNIT_DEFS.map((u,i)=>({kicker:`Part ${i+1} of ${UNIT_DEFS.length}`,name:u.name}));
    path=renderUnitAccordion('credit','Part',units,flat,completed,fi,true);
  }

  return topBar+tabs+hero+path;
}

function render(){
  // An armed "erase everything" must not survive navigating away and back.
  // Disarm before painting, so leaving the page is itself a cancel.
  if(getHashRoute().view!=='backup')S.resetArm=false;
  document.getElementById('app').innerHTML=renderApp();
  const route=getHashRoute();
  if(route.view==='plan'){
    if(!S.projIndex&&!S.projLoading&&!S.projError)loadProjIndex();
    if(!S.baIndex&&!S.baLoading&&!S.baError)loadBaIndex();
    if(!S.quizBank&&!S.quizLoading&&!S.quizError)loadQuizBank();
  }
  if(route.view==='lesson'&&!S.mdContent[route.id]&&!S.mdLoading[route.id]&&!S.mdError[route.id]){
    loadLesson(route.id);
  }
  if((route.track==='quiz'||route.view==='quiz'||route.view==='quizbank')&&!S.quizBank&&!S.quizLoading&&!S.quizError){
    loadQuizBank();
  }
  // Needed for the BA track page and for a BA lesson deep link, which has no
  // chapter index yet. Guarded on all three flags or the render self-loops
  // (LESSONS-LEARNED entry 6).
  if((route.track==='ba'||(route.view==='lesson'&&isBaId(route.id)))&&!S.baIndex&&!S.baLoading&&!S.baError){
    loadBaIndex();
  }
  // the index also feeds the "N banked" counts on the two track pages
  if(!S.projIndex&&!S.projLoading&&!S.projError)loadProjIndex();
  if(route.view==='project'&&S.projIndex&&!S.projMd[route.id]&&!S.projMdLoading[route.id]&&!S.projMdError[route.id]){
    loadProjMd(route.id);
  }
}

async function loadLesson(id){
  if(mdCache[id]){S.mdContent[id]=mdCache[id];render();return;}
  S.mdLoading[id]=true;render();
  try{
    const url=contentUrl(id);
    if(!url)throw new Error('no url');
    const res=await fetch(url);
    if(!res.ok)throw new Error('fetch failed');
    const text=await res.text();
    const html=mdToHtml(text);
    mdCache[id]=html;
    S.mdContent[id]=html;
    delete S.mdLoading[id];
    render();
  }catch(e){
    delete S.mdLoading[id];
    S.mdError[id]=true;
    render();
  }
}
function retryLesson(id){delete S.mdError[id];loadLesson(id);}

window.addEventListener('hashchange',render);
loadState();render();
</script>
